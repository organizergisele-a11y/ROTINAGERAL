async function sendLocalData(hid){
  const local = DB.houses.find(h => h.id === hid), R = DB.records[hid] || {}, keys = Object.keys(R);
  if (!local || !keys.length) return;
  if (!confirm(`Enviar as marcações de ${keys.length} dia(s) de "${local.name}" para a base compartilhada de "${H().name}"?\n\nSó serão acrescentadas as que ainda não existem na base. Nada será apagado deste aparelho.`)) return;
  const tot = {enviadas:0, jaExistiam:0, foraDaRotina:0, observacoes:0};
  try {
    for (let i = 0; i < keys.length; i += 300) {
      const parte = {}; keys.slice(i, i + 300).forEach(k => parte[k] = R[k]);
      const r = await call("POST", "/migrar", {legado:parte, origem:local.name});
      for (const x of Object.keys(tot)) tot[x] += r[x] || 0;
    }
    const ant = (local.migrado || {})[H().remote.casa] || {};
    (local.migrado ||= {})[H().remote.casa] = {em:Date.now(), enviadas:(ant.enviadas || 0) + tot.enviadas}; persist();
    toast(`Enviado: ${tot.enviadas} marcação(ões) nova(s)${tot.observacoes ? ` e ${tot.observacoes} observação(ões)` : ""}${tot.jaExistiam ? ` · ${tot.jaExistiam} já existiam` : ""}${tot.foraDaRotina ? ` · ${tot.foraDaRotina} não correspondem à rotina desta residência` : ""}.`);
    Object.values(DB.exec[H().id] || {}).forEach(x => x.rev = -1); S.weekAt = 0;
    await pull(); rerenderKeepScroll();
  } catch(e) { toast("Não foi salvo: " + e.message + (e.offline ? " Tente novamente quando houver internet." : "")); }
}

async function createResidence(){

  const local = baseId && DB.houses.find(h => h.id === baseId);

    h.id = "r_" + r.casa; h.remote = {casa:r.casa, rev:-1};

/* ---------- roteamento ---------- */
function route(){
  const h = location.hash.replace(/^#\/?/, "");
  const [view, arg, arg2] = h.split("/");
  const app = $("#app");
  const negar = msg => { if (msg) toast(msg); history.replaceState(null, "", "#/"); return route(); };
  // convite (#/convite/CASA/CODIGO) e entrada (#/entrar[/CASA]) não exigem sessão
  // o app funciona somente com login: sem sessão, apenas as telas de entrada
  if (!conn()) { const ch = connHouses()[0]; if (ch) { DB.current = ch.id; persist(); } }
  if (!conn()) {
    S.askedName = true;
    if (view === "convite" || view === "entrar") { /* segue abaixo */ }
    else if (view === "criar") { app.innerHTML = viewCreate(); return; }
    else { if (view) history.replaceState(null, "", "#/"); app.innerHTML = viewWelcome(); return; }
  }
  if (view === "criar") { app.innerHTML = viewCreate(); return; }
  if (view === "convite") { S.askedName = true; if (!S.invite || S.invite.casa !== arg || S.invite.codigo !== arg2) loadInvite(arg, arg2); app.innerHTML = viewInvite(); return; }
  if (view === "entrar") { S.askedName = true; app.innerHTML = viewLogin(arg); return; }
  if ((view === "gestao" || view === "editar") && !unlock()) return negar();
  if (view === "painel" && !(conn() && isAdm())) return negar(conn() ? "O painel é exclusivo da administradora." : "");
  if (view === "avisos" && !conn()) return negar();
  if (view === "instrucoes" && arg === "editar" && !canEdit() && !unlock()) return negar();
  if (view === "dia" && dayById(arg)) { app.innerHTML = viewDay(arg); bindDay(arg); }
  else if (view === "editar" && dayById(arg)) app.innerHTML = viewEditor(arg);
  else if (view === "gestao") app.innerHTML = viewManage();
  else if (view === "regras") app.innerHTML = viewRules();
  else if (view === "historico") {
    app.innerHTML = viewHistory();
    if (conn() && (!S.hist || S.hist.casa !== H().id || Date.now() - (S.histAt || 0) > 60000)) { S.histAt = Date.now(); loadHistory(); }
  }
  else if (view === "instrucoes") app.innerHTML = arg === "editar" ? viewProcEdit(arg2) : viewInstr(arg, arg2);
  else if (view === "painel") { app.innerHTML = viewPainel(); if (!S.semana || S.semana.casa !== H().id || Date.now() - S.semana.at > 60000) loadSemana(); }
  else if (view === "avisos") { app.innerHTML = viewAvisos(); markRead(); }
  else { app.innerHTML = viewHome(); const di = $("#date"); if (di) di.addEventListener("change", e => { if (e.target.value) { setDate(e.target.value); route(); } }); pullWeek(); }
  hydratePhotos(app);
  if (S.focusSel) { const el = $(S.focusSel); S.focusSel = null; if (el) { el.focus(); if (el.select) el.select(); } }
}
const currentDay = () => { const m = location.hash.match(/dia\/(\w+)/); return m ? m[1] : null; };
function rerenderKeepScroll(){ const y = window.scrollY; route(); window.scrollTo(0, y); }
function go(hash){ if (location.hash === hash) route(); else location.hash = hash; window.scrollTo(0, 0); }
// muda a data de referência; datas diferentes de hoje deixam de acompanhar a virada do dia
function goDate(d){
  setDate(d);
  const wd = weekdayId(d);
  if (location.hash.startsWith("#/painel")) { pull(); rerenderKeepScroll(); return; }
  go("#/dia/" + wd); pull();
}

function bindDay(day){
  const ta = $("#obs");
  if (ta) ta.addEventListener("input", () => {
    if (conn()) {
      if (S.obsBase === undefined) S.obsBase = (execDay(H().id, S.date).obs || {}).em || 0; // versão que a pessoa estava vendo
      setDraft(draftKey(S.date, "_dia"), ta.value);
      clearTimeout(S.obsT);
      S.obsT = setTimeout(() => {
        // substitui uma observação do dia que ainda não saiu da fila
        const i = DB.queue.findIndex((a, k) => a.hid === H().id && a.data === S.date && a.tarefa === "_dia" && (k > 0 || !flushing));
        if (i >= 0) DB.queue.splice(i, 1);
        enqueue({tipo:"obs", tarefa:"_dia", data:S.date, txt:ta.value, base:S.obsBase ?? ((execDay(H().id, S.date).obs || {}).em || 0)});
        S.obsBase = undefined;
        $("#saved").textContent = S.online ? "Observação enviada." : "Observação guardada · será enviada quando houver internet.";
      }, 1200);
      return;
    }
    const r = rec(S.date, day, true); r.obs = ta.value; r.updated = Date.now(); save();
    $("#saved").textContent = storageOK ? "Observação salva neste aparelho." : "Não foi possível salvar neste navegador.";
  });
}
function setDone(day, id, val){
  const r = rec(S.date, day, true);
  if (val) r.done[id] = 1; else delete r.done[id];
  r.updated = Date.now(); save();
}

document.addEventListener("input", e => {

document.addEventListener("toggle", e => { const b = e.target.dataset && e.target.dataset.bid; if (b) S.edOpen[b] = e.target.open; }, true);

document.addEventListener("click", e => {
  const el = e.target.closest("[data-goday],[data-edit],[data-nav],[data-toggle],[data-act],[data-done],[data-rtab],[data-open],[data-ed],[data-gedit],[data-gadd],[data-quick],[data-otask],[data-tk],[data-cam],[data-gal],[data-zoomph],[data-zoomsrc],[data-proc]");
  if (!el) return;
  const ds = el.dataset;
  if (ds.goday) { setDate(dateOfWeekday(S.date, ds.goday)); go("#/dia/" + ds.goday); pull(); return; }
  if (ds.edit) { go("#/editar/" + ds.edit); return; }
  if (ds.nav !== undefined) { removeSheet(); S.openTask = null; go(ds.nav ? "#/" + ds.nav : "#/"); return; }
  if (ds.rtab) { ruleTab = ds.rtab; route(); return; }
  if (ds.open) { const [date] = ds.open.split("|"); goDate(date); return; }
  if (ds.toggle) { S.closed[ds.toggle] = !(S.closed[ds.toggle] ?? false); rerenderKeepScroll(); return; }
  if (ds.done) { setDone(currentDay(), ds.done, true); toast("Tarefa concluída"); rerenderKeepScroll(); return; }
  if (ds.quick) { quickRegister(ds.quick); return; }
  if (ds.otask) { openTask(ds.otask); return; }
  if (ds.tk) { taskAction(ds.tk); return; }
  if (ds.cam || ds.gal) { const t = findTask(S.openTask); if (!t) return; S.photoTarget = {data:S.date, tarefa:t.id, tipo:ds.cam || ds.gal}; $(ds.cam ? "#camin" : "#galin").click(); return; }
  if (ds.zoomph) { photoURL(JSON.parse(ds.zoomph)).then(openViewer).catch(() => toast("Foto indisponível")); return; }
  if (ds.zoomsrc !== undefined) { const p = procById(ds.pid); if (p) openViewer(p.imagens[+ds.zoomsrc]); return; }
  if (ds.proc) { openProcSheet(ds.proc); return; }
  if (ds.ed) { edAction(ds.ed, el); return; }
  if (ds.gedit) { guideSheet(H().guides.find(g => g.id === ds.gedit)); return; }
  if (ds.gadd) { guideSheet(null, ds.gadd); return; }
  const day = currentDay();
  switch (ds.act) {
    case "pending": S.onlyPending = !S.onlyPending; rerenderKeepScroll(); break;
    case "expand": blocksOf(day).forEach(b => S.closed[`${day}-${b.id}`] = false); rerenderKeepScroll(); break;
    case "collapse": blocksOf(day).forEach(b => S.closed[`${day}-${b.id}`] = true); rerenderKeepScroll(); break;
    case "print": window.print(); break;
    case "install": doInstall(); break;
    case "sheet-close": closeSheet(); break;
    case "export": shareText(reportText(day), `${slug(H().name)}_${S.date}_${day}.txt`, "ROTINA GERAL · Relatório"); break;
    case "weekreport": shareText(weekText(), `${slug(H().name)}_semana_${mondayOf(S.date)}.txt`, "ROTINA GERAL · Relatório da semana"); break;
    case "reset":
      if (confirm(`Reiniciar o checklist de ${dayById(day).name} em ${fmtDate(S.date,{day:"2-digit",month:"2-digit",year:"numeric"})}? As marcações e a observação deste dia serão apagadas.`)) {
        // registro vazio (e não apagado) para que o reinício também chegue aos outros aparelhos
        RECS()[rkey(S.date, day)] = {done:{}, obs:"", updated:Date.now()}; save(); toast("Checklist reiniciado"); rerenderKeepScroll();
      } break;
    case "wipe":
      if (confirm(H().sync ? `Apagar todo o histórico de ${H().name}? Como a casa é compartilhada, o histórico também será apagado nos outros celulares conectados.`
          : `Apagar todo o histórico de ${H().name} salvo neste aparelho? Esta ação não pode ser desfeita.`)) {
        const R = RECS(), now = Date.now();
        if (H().sync) Object.keys(R).forEach(k => R[k] = {done:{}, obs:"", updated:now}); else DB.records[DB.current] = {};
        save(); route(); toast("Histórico apagado"); }
      break;
    case "pickdate": go("#/"); setTimeout(() => { const di = $("#date"); if (di) { di.focus(); if (di.showPicker) try { di.showPicker(); } catch(_){} } }, 60); break;
    case "pickhouse": pickHouseSheet(); break;
    case "rename": if (unlock()) renameSheet(false); break;
    case "rename-save": {
      const n = $("#rn-name").value.trim(); if (!n) { toast("Informe o nome da casa ou do cliente"); break; }
      const h = H(); h.name = n; h.subtitle = $("#rn-sub").value.trim() || h.subtitle;
      delete DB.needsName; touch(); save(); closeSheet(); rerenderKeepScroll(); toast("Nome atualizado"); break;
    }
    case "rename-skip": delete DB.needsName; save(); closeSheet(); break;
    case "house-use": DB.current = ds.id; save(); closeSheet(); rerenderKeepScroll(); toast(`Rotina de ${H().name}`); break;
    case "house-new": newHouseSheet(); break;
    case "house-create": createHouse(); break;
    case "house-del": {
      const x = DB.houses.find(y => y.id === ds.id);
      const pend = DB.queue.filter(a => a.hid === ds.id).length;
      if (!x || !confirm(`Remover "${x.name}" deste aparelho?\n\nOs dados continuam guardados no servidor; para voltar, basta entrar de novo com o PIN.${pend ? `\n\nAtenção: ${pend} registro(s) ainda não foram enviados e serão perdidos.` : ""}`)) break;
      DB.houses = DB.houses.filter(y => y.id !== ds.id);
      for (const k of ["records", "auth", "exec", "notif", "resid", "sum"]) delete DB[k][ds.id];
      DB.queue = DB.queue.filter(a => a.hid !== ds.id);
      if (DB.current === ds.id) DB.current = DB.houses[0].id;
      save(); route(); toast("Casa excluída deste aparelho"); break;
    }
    case "export-house": { const {remote, ...hh} = H(); shareJSON({type:"rotina-geral/casa", v:3, exported:Date.now(), house:hh}, `Rotina_${slug(H().name)}.json`, `Rotina · ${H().name}`); break; }
    // o backup não leva sessões, fila nem cache do servidor (dados de acesso não saem do aparelho)
    case "export-backup": { const {auth, queue, exec, notif, resid, sum, ...db} = DB; shareJSON({type:"rotina-geral/backup", v:3, exported:Date.now(), db}, `Backup_Rotina_Geral_${todayISO()}.json`, "Backup · ROTINA GERAL"); break; }
    case "import": $("#filein").click(); break;

    case "cf-minha": resolveConflict("minha"); break;
    case "cf-juntar": resolveConflict("juntar"); break;
    case "cf-dela": resolveConflict("dela"); break;
    case "mig-send": sendLocalData(ds.id); break;
    case "csv": exportCSV(); break;
    case "cr-go": createResidence(); break;
    case "lock": setUnlocked(false); go("#/"); toast("Modo de edição encerrado"); break;
    case "g-save": guideSave(ds.id, ds.sec); break;
    case "g-del": if (confirm("Excluir esta orientação?")) { const h = H(); h.guides = h.guides.filter(g => g.id !== ds.id); touch(); save(); closeSheet(); route(); } break;
    /* rotina do dia */

    case "prevday": goDate(addDays(S.date, -1)); break;
    case "nextday": goDate(addDays(S.date, 1)); break;
    case "today": goDate(todayISO()); break;
    case "mine": S.onlyMine = !S.onlyMine; rerenderKeepScroll(); break;
    case "extra-new": if (unlock()) extraSheet(); break;
    case "extra-save": extraSave(); break;
    case "extra-del": if (confirm("Excluir esta atividade extraordinária? Os registros já feitos permanecem no histórico do servidor.")) { const h = H(); h.extras = h.extras.filter(x => x.id !== ds.id); touch(); save(); closeSheet(); } break;
    case "proc-leu": { const t = findTask(S.openTask); if (t) { S.leu[S.date + t.id] = true; toast("Leitura confirmada"); } renderTaskSheet(true); break; }
    case "proc-voltar": renderTaskSheet(true); break;
    /* residência conectada */
    case "conn-new": connectSheet(); break;
    case "conn-create": connectCreate(); break;
    case "lg-casa": loginStep(); break;
    case "lg-go": loginGo(); break;
    case "cv-go": inviteGo(); break;
    case "usr-criar": { const n = $("#nu-nome").value.trim(); if (n.length < 2) { toast("Informe o nome da pessoa."); break; } userOp({op:"criar", nome:n, papel:$("#nu-papel").value}); break; }
    case "usr-convite": if (confirm(`Gerar um novo convite para ${ds.nome}? O PIN atual dela deixa de funcionar e ela precisará criar outro.`)) userOp({op:"convite", id:ds.id}); break;
    case "usr-papel": userOp({op:"papel", id:ds.id, papel:ds.papel}); break;
    case "usr-off": if (confirm("Desativar esta pessoa? Ela perde o acesso imediatamente; o histórico dela é mantido.")) userOp({op:"desativar", id:ds.id}); break;
    case "usr-on": userOp({op:"ativar", id:ds.id}); break;
    case "cfg-save":
      call("PUT", "/residencia", {tz:$("#cfg-tz").value, retencaoDias:+$("#cfg-ret").value})
        .then(() => { const R = resid(); R.tz = $("#cfg-tz").value; R.retencaoDias = +$("#cfg-ret").value; H().tz = R.tz; touch(); persist(); toast("Configurações salvas"); })
        .catch(err => toast(err.message));
      break;
    case "logout":
      if (pendingCount() && !confirm(`Há ${pendingCount()} registro(s) ainda não enviados. Se sair agora, eles serão perdidos. Sair mesmo assim?`)) break;
      if (!pendingCount() && !confirm("Sair desta conta neste aparelho? Para entrar de novo será preciso o PIN.")) break;
      delete DB.auth[H().id]; DB.queue = DB.queue.filter(a => a.hid !== H().id); persist(); go("#/"); toast("Você saiu desta conta neste aparelho"); break;
    case "frases-edit": frasesSheet(); break;
    case "frases-reset": $("#fr-txt").value = SEED.frases.join("\n"); break;
    case "frases-save": {
      const l = $("#fr-txt").value.split("\n").map(s => s.trim()).filter(Boolean);
      if (l.length !== 31) { toast(`São necessárias 31 frases (uma por linha). Agora há ${l.length}.`); break; }
      H().frases = l; touch(); save(); closeSheet(); route(); toast("Frases salvas"); break;
    }
    /* central de instruções */
    case "cat-new": { const n = prompt("Nome da nova categoria:"); if (!n || n.trim().length < 2) break; H().instr.cats.push({id:"c" + uid(), nome:n.trim(), icon:"book", subs:[]}); touch(); save(); route(); break; }
    case "cat-edit": { const c = catById(ds.id), n = prompt("Nome da categoria:", c.nome); if (!n || n.trim().length < 2) break; c.nome = n.trim(); touch(); save(); route(); break; }
    case "cat-del": {
      const c = catById(ds.id);
      if (H().instr.procs.some(p => p.cat === c.id)) { toast("Mova ou exclua os procedimentos antes de excluir a categoria."); break; }
      if (!confirm(`Excluir a categoria "${c.nome}"?`)) break;
      H().instr.cats = H().instr.cats.filter(x => x.id !== c.id); touch(); save(); go("#/instrucoes"); break;
    }
    case "sub-new": { const n = prompt("Nome da nova subcategoria:"); if (!n || n.trim().length < 2) break; catById(ds.cat).subs.push({id:"s" + uid(), nome:n.trim()}); touch(); save(); route(); break; }
    case "sub-edit": {
      const c = H().instr.cats.find(x => x.subs.some(s => s.id === ds.id)), s = c.subs.find(x => x.id === ds.id);
      const n = prompt("Nome da subcategoria (deixe em branco para excluir):", s.nome); if (n === null) break;
      if (!n.trim()) { if (H().instr.procs.some(p => p.sub === s.id)) { toast("Mova os procedimentos antes de excluir a subcategoria."); break; } c.subs = c.subs.filter(x => x.id !== s.id); }
      else s.nome = n.trim();
      touch(); save(); route(); break;
    }
    case "proc-new": S.newProc = {cat:ds.cat, sub:ds.sub}; S.procImgs = null; go("#/instrucoes/editar/novo"); break;
    case "proc-save": procSave(ds.id); break;
    case "proc-del": {
      const p = procById(ds.id); if (!p || !confirm(`Excluir o procedimento "${p.nome}"? As tarefas associadas ficam sem instrução.`)) break;
      const I = H().instr; I.procs = I.procs.filter(x => x.id !== p.id);
      H().days.forEach(d => d.blocks.forEach(b => b.tasks.forEach(t => { if (t.proc === p.id) { delete t.proc; delete t.procObrig; } })));
      touch(); save(); go("#/instrucoes/c/" + p.cat); break;
    }
    case "pimg-add": $("#imgin").click(); break;
    case "pimg-del": S.procImgs.list.splice(+ds.i, 1); $("#pe-imgs").innerHTML = procImgsHTML(); break;
  }
});

/* ---------- impressão: tudo expandido e sem filtro ---------- */
let printSnap = null;
window.addEventListener("beforeprint", () => {
  const day = currentDay(); if (!day) return;
  printSnap = {closed:{...S.closed}, only:S.onlyPending};
  S.onlyPending = false; blocksOf(day).forEach(b => S.closed[`${day}-${b.id}`] = false); route();
});
window.addEventListener("afterprint", () => { if (!printSnap) return; S.closed = printSnap.closed; S.onlyPending = printSnap.only; printSnap = null; route(); });

/* ---------- aplicativo instalável ---------- */
let deferredPrompt = null;
const isStandalone = () => window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isAndroid = () => /Android/i.test(navigator.userAgent);
function canPrint(){ return !(isIOS() && isStandalone()); }
window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferredPrompt = e; if (!location.hash.replace(/^#\/?/, "")) rerenderKeepScroll(); });
window.addEventListener("appinstalled", () => { deferredPrompt = null; closeSheet(); toast("Aplicativo instalado na tela inicial"); rerenderKeepScroll(); });
function installCard(){
  if (isStandalone()) return "";
  return `<div class="card install">
    <img class="ico" src="icon-192.png" alt="">
    <div class="tx"><b>Instalar o aplicativo</b>Abra a rotina pela tela inicial, em tela cheia e mesmo sem internet.</div>
    <button class="btn pri" data-act="install">Instalar</button></div>`;
}
const PLUS_IC = `<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg>`;
const DOTS_IC = `<svg class="ic" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="19" r="1.8"/></svg>`;
function installSheetHTML(){
  const tip = `<p class="tip">Abra sempre pelo ícone: as marcações feitas no app ficam guardadas no próprio app.</p>`;
  if (isIOS()) return `<div class="kick">iPhone e iPad</div><h3>Adicionar à Tela de Início</h3><ol>
    <li><span>Abra este link no <b>Safari</b>.</span></li>
    <li><span>Toque em <b>Compartilhar</b> ${icon("share")} na barra do navegador.</span></li>
    <li><span>Role as opções e toque em <b>Adicionar à Tela de Início</b> ${PLUS_IC}.</span></li>
    <li><span>Confirme em <b>Adicionar</b>. O ícone ROTINA GERAL aparece na tela inicial.</span></li></ol>${tip}`;
  return `<div class="kick">${isAndroid() ? "Android" : "Navegador"}</div><h3>Instalar o aplicativo</h3><ol>
    <li><span>Abra este link no <b>Google Chrome</b>.</span></li>
    <li><span>Toque no menu ${DOTS_IC} no canto superior direito.</span></li>
    <li><span>Toque em <b>Instalar app</b> ou <b>Adicionar à tela inicial</b>.</span></li>
    <li><span>Confirme em <b>Instalar</b>. O ícone ROTINA GERAL aparece na tela inicial.</span></li></ol>${tip}`;
}
async function doInstall(){
  if (deferredPrompt) {
    const p = deferredPrompt; deferredPrompt = null;
    p.prompt();
    try { const r = await p.userChoice; if (r.outcome !== "accepted") toast("Instalação cancelada"); } catch(_) {}
    rerenderKeepScroll(); return;
  }
  openSheet(installSheetHTML() + `<button class="btn pri full" style="width:100%" data-act="sheet-close">Entendi</button>`);
}
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(reg => {
      reg.addEventListener("updatefound", () => {
        const w = reg.installing;
        if (w) w.addEventListener("statechange", () => { if (w.state === "installed" && navigator.serviceWorker.controller) toast("Nova versão instalada — reabra o app para atualizar"); });
      });
    }).catch(() => {});
  });
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_) {}
}

load();
if (!conn()) { const ch = connHouses()[0]; if (ch) DB.current = ch.id; }
// abre sempre na rotina do dia em que o app está sendo aberto (no fuso horário da residência)
S.today = todayISO(); S.date = S.today;
if ((!location.hash || location.hash === "#" || location.hash === "#/") && conn()) {
  const wd = weekdayId(S.date);
  if (allTasks(wd, S.date).length) history.replaceState(null, "", "#/dia/" + wd);
}
window.addEventListener("hashchange", () => { route(); window.scrollTo(0,0); });
route();
if (conn()) { flush(); pull(); if (H().remote.dirty) pushRoutine(); }
// virada do dia: quem está na rotina de hoje passa para a do novo dia; o dia anterior fica no histórico, sem ser apagado
function checkDay(){
  const t = todayISO(); if (t === S.today) return;
  const old = S.today; S.today = t; S.hideFrase = false;
  if (S.date !== old) return;
  setDate(t);
  if (currentDay()) { history.replaceState(null, "", "#/dia/" + weekdayId(t)); }
  toast("Novo dia: rotina de " + fmtDate(t, {weekday:"long", day:"2-digit", month:"2-digit"}));
  removeSheet(); S.openTask = null; rerenderKeepScroll(); if (conn()) pull();
}
setInterval(() => { checkDay(); if (document.visibilityState === "visible" && conn()) { flush(); pull(); } }, 15000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkDay(); if (conn()) { flush(); pull(); } } });
window.addEventListener("online", () => { S.online = true; if (conn()) { flush(); pull(); } });
window.addEventListener("offline", () => { S.online = false; softRender(); });
</script>
