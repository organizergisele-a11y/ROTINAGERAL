<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4A4A3F">
<meta name="color-scheme" content="light">
<title>ROTINA GERAL</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROTINA GERAL">
<meta name="application-name" content="ROTINA GERAL">
<meta name="description" content="Rotina de organização e manutenção residencial · Gisele Oliveira">
<meta name="robots" content="noindex, nofollow">
<style>
:root{--g:#4A4A3F;--gd:#33332B;--t:#2B2B26;--mut:#77736A;--gold:#AD8B46;--gs:#C9AD72;--cream:#F3F0E8;--bg:#F7F5EF;--line:#E2DED3;--rust:#A15C3C;--rustbg:#F7EFEA;--ok:#5E7350;
--serif:Cambria,Caladea,Georgia,"Times New Roman",serif;--sans:Calibri,Carlito,-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;background:var(--bg);color:var(--t);}
body{font-family:var(--sans);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%;min-height:100vh;}
button{font:inherit;color:inherit;}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 40px;}
.serif{font-family:var(--serif);}
.kick{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);}
.ic{width:20px;height:20px;flex:none;}
[hidden]{display:none!important;}

/* HERO */
.hero{background:var(--g);color:#fff;padding:calc(24px + env(safe-area-inset-top)) 16px 28px;text-align:center;}
.hero img{width:132px;height:132px;display:block;margin:4px auto 14px;}
.hero h1{font-family:var(--serif);font-weight:400;font-size:34px;margin:6px 0 4px;letter-spacing:.01em;}
.hero .sub{font-family:var(--serif);font-style:italic;color:var(--gs);font-size:17px;}
.hero .rule{width:44px;height:1px;background:var(--gold);margin:14px auto;}
.hero .by{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#d8d4c8;}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px;}
.datecard{display:flex;align-items:center;gap:12px;margin-top:-18px;position:relative;box-shadow:0 6px 18px rgba(51,51,43,.08);}
.datecard label{flex:1;}
.datecard input{font:inherit;font-size:17px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;background:var(--bg);color:var(--t);min-height:48px;}
.datecard .lbl{display:block;margin-bottom:6px;}
.today{display:flex;gap:14px;align-items:center;background:var(--g);color:#fff;border:0;cursor:pointer;width:100%;text-align:left;}
.today .n{font-family:var(--serif);font-size:40px;color:var(--gold);line-height:1;}
.today .d{font-family:var(--serif);font-size:22px;}
.today .f{color:var(--gs);font-family:var(--serif);font-style:italic;font-size:15px;}
.today .go{margin-left:auto;font-size:26px;color:var(--gs);}
.sect{margin:24px 0 8px;display:flex;align-items:center;gap:10px;}
.sect::after{content:"";flex:1;height:1px;background:var(--line);}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.dcard{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 4px 10px;text-align:center;cursor:pointer;min-height:96px;display:flex;flex-direction:column;align-items:center;gap:6px;}
.dcard .a{font-size:14px;letter-spacing:.16em;color:var(--gd);font-weight:600;}
.dcard.cur{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold);}
.ring{width:42px;height:42px;}
.ring .bgc{stroke:var(--line);} .ring .fg{stroke:var(--gold);transition:stroke-dashoffset .3s;}
.ring text{font-size:10px;fill:var(--mut);font-family:var(--sans);}
.dlist .row{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.dlist .row:last-child{border-bottom:0;}
.dlist .row b{font-weight:600;letter-spacing:.12em;color:var(--gold);width:40px;flex:none;font-size:14px;padding-top:2px;}
.dlist .row span{font-family:var(--serif);}
.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.lbtn{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;gap:10px;align-items:center;cursor:pointer;min-height:56px;text-align:left;}
.lbtn .ic{color:var(--gold);}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:18px;}

/* APP BAR */
.bar{position:sticky;top:0;z-index:20;background:var(--g);color:#fff;padding-top:env(safe-area-inset-top);}
.bar .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:6px;padding:6px 8px;}
.ib{background:none;border:0;color:#fff;width:44px;height:44px;border-radius:10px;display:grid;place-items:center;cursor:pointer;}
.ib:active{background:rgba(255,255,255,.12);}
.bar .tt{flex:1;font-family:var(--serif);font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tabs{display:flex;max-width:640px;margin:0 auto;padding:0 8px 8px;gap:6px;}
.tab{flex:1;background:transparent;border:1px solid rgba(201,173,114,.45);color:#e8e4d8;border-radius:10px;padding:9px 0;font-size:14px;letter-spacing:.14em;font-weight:600;cursor:pointer;min-height:44px;}
.tab.on{background:var(--gold);border-color:var(--gold);color:#fff;}

/* DAY */
.dhead{padding:18px 0 4px;}
.dhead h2{font-family:var(--serif);font-weight:400;font-size:28px;margin:4px 0 2px;color:var(--gd);}
.dhead .foc{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:17px;}
.dhead .goal{margin-top:10px;font-family:var(--serif);font-size:16px;color:var(--t);}
.warn{background:var(--rustbg);border-left:3px solid var(--rust);padding:10px 12px;border-radius:8px;font-size:14px;margin-top:12px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.chip{background:var(--cream);border-left:2px solid var(--gold);padding:6px 10px;border-radius:6px;font-size:14px;display:flex;gap:6px;align-items:center;}
.chip .ic{width:14px;height:14px;color:var(--gold);}
.prog{margin-top:16px;}
.prog .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mut);}
.prog .pct{font-family:var(--serif);font-size:26px;color:var(--gd);}
.pbar{height:10px;background:var(--cream);border-radius:99px;overflow:hidden;margin-top:6px;}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gs));width:0;transition:width .3s;border-radius:99px;}
.next{background:var(--g);color:#fff;border-radius:14px;padding:14px 16px;margin-top:14px;display:flex;gap:12px;align-items:center;}
.next .k2{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gs);}
.next .tx{font-family:var(--serif);font-size:18px;line-height:1.3;margin-top:2px;}
.next .bk{font-size:13px;color:#cfcabd;margin-top:2px;}
.next button{margin-left:auto;background:var(--gold);border:0;color:#fff;border-radius:10px;padding:0 14px;min-height:48px;font-weight:600;cursor:pointer;flex:none;}
.next.done{background:var(--ok);}
.ctrl{display:flex;gap:8px;margin-top:14px;}
.tg2{flex:1;background:#fff;border:1px solid var(--line);border-radius:10px;min-height:46px;font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;}
.tg2.on{background:var(--gd);color:#fff;border-color:var(--gd);}
.blk{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;}
.blk.complete{border-color:#cdbf9c;}
.bh{width:100%;background:none;border:0;display:flex;align-items:center;gap:12px;padding:14px 14px;cursor:pointer;text-align:left;min-height:64px;}
.bh .bi{width:38px;height:38px;border-radius:10px;background:var(--cream);display:grid;place-items:center;color:var(--gold);flex:none;}
.blk.complete .bh .bi{background:var(--gold);color:#fff;}
.bh .bt{flex:1;min-width:0;}
.bh .bn{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);}
.bh .nm{font-family:var(--serif);font-size:18px;color:var(--gd);line-height:1.2;}
.bh .wh{font-size:13px;color:var(--mut);}
.bh .ct{font-size:14px;color:var(--mut);white-space:nowrap;}
.bh .chev{transition:transform .2s;color:var(--mut);}
.blk.closed .chev{transform:rotate(-90deg);}
.blk.closed .bb{display:none;}
.bb{border-top:1px solid var(--line);}
.task{display:flex;gap:14px;align-items:flex-start;padding:12px 14px;border-bottom:1px solid #F0EDE5;cursor:pointer;min-height:56px;user-select:none;}
.task:last-of-type{border-bottom:0;}
.task input{position:absolute;opacity:0;width:1px;height:1px;}
.box{width:28px;height:28px;border:2px solid var(--g);border-radius:8px;flex:none;display:grid;place-items:center;margin-top:-1px;transition:background .15s;}
.box svg{opacity:0;width:18px;height:18px;color:#fff;}
.task.on .box{background:var(--gold);border-color:var(--gold);}
.task.on .box svg{opacity:1;}
.task .txt{flex:1;font-size:17px;line-height:1.38;}
.task.on .txt{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(119,115,106,.5);}
.task.pausa .txt{font-style:italic;color:var(--mut);}
.task.pausa .box{border-style:dashed;}
.task:focus-within{outline:2px solid var(--gs);outline-offset:-2px;}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:2px;font-style:normal;text-decoration:none;}
.tag.prior{background:var(--gold);color:#fff;}
.tag.pausa{border-color:#a9a598;color:var(--mut);}
.tnote{display:block;font-size:14px;color:var(--mut);font-style:italic;margin-top:3px;text-decoration:none;}
.res{background:var(--cream);font-size:14px;padding:10px 14px;color:var(--gd);}
.res b{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600;display:block;}
.empty{padding:14px;font-size:15px;color:var(--mut);font-style:italic;}
textarea{width:100%;min-height:120px;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg);color:var(--t);resize:vertical;}
.saved{font-size:12px;color:var(--mut);margin-top:6px;min-height:16px;}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.sum .n{font-family:var(--serif);font-size:30px;color:var(--gd);line-height:1.1;}
.sum .l{font-size:13px;color:var(--mut);}
.pend{margin:10px 0 0;padding:0;list-style:none;}
.pend li{padding:8px 0;border-bottom:1px solid var(--line);font-size:15px;display:flex;gap:10px;}
.pend li b{font-weight:600;color:var(--gold);font-size:12px;letter-spacing:.1em;white-space:nowrap;padding-top:2px;}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.btn{background:#fff;border:1px solid var(--g);color:var(--gd);border-radius:12px;min-height:52px;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 12px;}
.btn.pri{background:var(--g);color:#fff;}
.btn.dan{border-color:var(--rust);color:var(--rust);}
.btn.full{grid-column:1/-1;}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(140%);background:var(--gd);color:#fff;padding:12px 18px;border-radius:12px;font-size:15px;transition:transform .25s;z-index:50;max-width:92vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* RULES */
.rcard h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 4px;color:var(--gd);display:flex;gap:10px;align-items:center;}
.rcard h3 .ic{color:var(--gold);}
.rcard .meta{font-size:14px;color:var(--gold);margin-bottom:6px;}
.rcard ul{margin:6px 0 0;padding-left:18px;font-size:15px;}
.rcard li{margin-bottom:4px;}
.st{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);padding:1px 6px;border-radius:4px;margin-left:auto;white-space:nowrap;}
.st.v{border-color:var(--rust);color:var(--rust);}
.wk .row{padding:10px 0;border-bottom:1px solid var(--line);}
.wk .row:last-child{border-bottom:0;}
.wk .lab{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:4px;}
.wk .vals{display:grid;grid-template-columns:44px 1fr;gap:2px 8px;font-size:14.5px;}
.wk .vals b{font-weight:600;color:var(--gd);font-size:12.5px;letter-spacing:.1em;padding-top:2px;}
.seg{display:flex;gap:6px;overflow-x:auto;padding:12px 0 2px;scrollbar-width:none;}
.seg::-webkit-scrollbar{display:none;}
.seg button{flex:none;background:#fff;border:1px solid var(--line);border-radius:99px;padding:8px 14px;font-size:14px;cursor:pointer;min-height:40px;}
.seg button.on{background:var(--gd);color:#fff;border-color:var(--gd);}
.hist .row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.hist .row:last-child{border-bottom:0;}
.hist .dt{flex:1;}
.hist .dt div:first-child{font-family:var(--serif);font-size:17px;}
.hist .dt div:last-child{font-size:13px;color:var(--mut);}
.foot{text-align:center;margin-top:28px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);}
.foot img{width:44px;opacity:.9;display:block;margin:0 auto 8px;}

/* INSTALAÇÃO */
.install{display:flex;gap:14px;align-items:center;}
.install .ico{width:52px;height:52px;border-radius:12px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.15);}
.install .tx{flex:1;font-size:15px;line-height:1.35;}
.install .tx b{font-family:var(--serif);font-weight:400;font-size:18px;display:block;color:var(--gd);}
.install .btn{min-height:46px;flex:none;}
.sheet-bg{position:fixed;inset:0;background:rgba(30,30,25,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center;}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;}
.sheet h3{font-family:var(--serif);font-weight:400;font-size:22px;margin:4px 0 12px;color:var(--gd);}
.sheet ol{list-style:none;margin:0;padding:0;counter-reset:s;}
.sheet li{counter-increment:s;display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;}
.sheet li::before{content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none;font-size:14px;font-weight:600;}
.sheet li .ic{display:inline-block;vertical-align:-4px;color:var(--gold);}
.sheet .tip{font-size:14px;color:var(--mut);margin:12px 0 14px;}

/* PRINT */
.ponly{display:none;}
@media print{
  @page{size:A4;margin:14mm 12mm;}
  body{background:#fff;font-size:11pt;}
  .bar,.ctrl,.acts,.next,.noprint,.toast,.chev,.warn{display:none!important;}
  .ponly{display:block;}
  .wrap{max-width:none;padding:0;}
  .blk{break-inside:avoid;border-radius:0;margin-top:8px;}
  .blk.closed .bb{display:block!important;}
  .task{display:flex!important;min-height:0;padding:5px 10px;}
  .box{width:16px;height:16px;border-width:1.5px;border-radius:3px;}
  .box svg{width:12px;height:12px;}
  .task .txt{font-size:10.5pt;}
  .bh{min-height:0;padding:8px 10px;}
  .bh .bi{width:26px;height:26px;}
  textarea{border:1px solid #999;min-height:60px;}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
}

/* ===== v2: semana, gestão e editor ===== */
.hswitch{background:transparent;border:1px solid rgba(201,173,114,.5);color:var(--gs);border-radius:99px;padding:7px 16px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;cursor:pointer;min-height:36px;}
.days{grid-template-columns:repeat(var(--n,5),minmax(0,1fr));gap:6px;}
.dcard{min-width:0;padding:10px 2px 8px;gap:4px;min-height:92px;}
.dcard .dt{font-size:11px;color:var(--mut);}
.dcard .a{font-size:13px;letter-spacing:.1em;}
.ring{width:100%;max-width:42px;height:auto;}
.wsum .top{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mut);}
.wsum .pct{font-family:var(--serif);font-size:24px;color:var(--gd);}
.wsum .btn{margin-top:12px;width:100%;}
.lbtn.wide{grid-column:1/-1;}
.fld{display:block;margin-top:12px;}
.fld>span{display:block;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:5px;}
.inp{width:100%;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--t);min-height:46px;}
textarea.inp{min-height:72px;resize:vertical;line-height:1.35;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.eblk{background:#fff;border:1px solid var(--line);border-radius:14px;margin-top:12px;overflow:hidden;}
.eblk>summary{list-style:none;display:flex;gap:12px;align-items:center;padding:14px;cursor:pointer;min-height:62px;}
.eblk>summary::-webkit-details-marker{display:none;}
.eblk>summary .bi{width:38px;height:38px;border-radius:10px;background:var(--cream);display:grid;place-items:center;color:var(--gold);flex:none;}
.eblk>summary .bt{flex:1;min-width:0;}
.eblk>summary .chev{transition:transform .2s;color:var(--mut);transform:rotate(-90deg);}
.eblk[open]>summary .chev{transform:none;}
.ebody{border-top:1px solid var(--line);padding:2px 14px 14px;}
.etask{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px;background:var(--bg);}
.etask .inp{background:#fff;}
.etask textarea.inp{min-height:52px;}
.etask .num{font-size:11px;letter-spacing:.16em;color:var(--gold);margin-bottom:6px;text-transform:uppercase;}
.etools{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap;}
.etools .inp{flex:1;min-width:130px;min-height:44px;}
.mini{background:#fff;border:1px solid var(--line);border-radius:10px;width:44px;height:44px;display:grid;place-items:center;cursor:pointer;color:var(--gd);flex:none;padding:0;}
.mini.dan{color:var(--rust);border-color:#e6cfc3;}
.mini:disabled{opacity:.3;cursor:default;}
.addb{width:100%;margin-top:12px;background:transparent;border:1.5px dashed var(--gs);color:var(--gd);border-radius:12px;min-height:50px;cursor:pointer;display:flex;gap:8px;align-items:center;justify-content:center;font-size:15px;}
.addb .ic{color:var(--gold);}
.sw{display:flex;gap:12px;align-items:center;cursor:pointer;font-size:16px;}
.sw input{width:24px;height:24px;accent-color:var(--gold);flex:none;}
.bacts{display:flex;gap:6px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);align-items:center;}
.bacts .sp{flex:1;font-size:12px;color:var(--mut);}
.hrow{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.hrow:last-child{border-bottom:0;}
.hrow .nm{flex:1;min-width:0;}
.hrow .nm div:first-child{font-family:var(--serif);font-size:17px;}
.hrow .nm div:last-child{font-size:13px;color:var(--mut);}
.hrow .btn{min-height:44px;font-size:14px;}
.cur{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:2px 6px;}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;}
.opt input{width:22px;height:22px;accent-color:var(--gold);margin-top:2px;flex:none;}
.opt b{font-family:var(--serif);font-weight:400;font-size:17px;display:block;color:var(--gd);}
.opt small{font-size:14px;color:var(--mut);}
.gbtn{margin-left:auto;background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;display:grid;place-items:center;color:var(--gold);cursor:pointer;flex:none;}
.rcard h3 .st+.gbtn{margin-left:6px;}
.edflag{background:var(--gold);color:#fff;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:5px 8px;}
.help{font-size:14px;color:var(--mut);margin:8px 0 0;}
.sheet .acts{margin-top:16px;}
.code{font-family:var(--serif);font-size:26px;letter-spacing:.12em;text-align:center;color:var(--gd);background:var(--cream);border-radius:10px;padding:12px;margin-top:10px;}
.hname{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;}
.hswitch{display:inline-flex;align-items:center;gap:8px;max-width:100%;}
.hswitch .ic{width:14px;height:14px;flex:none;}
.hedit{background:none;border:1px solid rgba(201,173,114,.5);color:var(--gs);border-radius:99px;width:36px;height:36px;display:grid;place-items:center;cursor:pointer;padding:0;}

/* ===== v3: residência conectada, verificação, instruções ===== */
:root{--s-pend:#7d786d;--s-and:#3c6a8a;--s-pau:#8a6d2f;--s-agu:#9a6a12;--s-ok:#4f6b42;--s-apr:#35552c;--s-cor:#A15C3C;--s-imp:#6f5656;}
.ic.sm{width:14px;height:14px;}
.stc{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;letter-spacing:.04em;border:1px solid currentColor;border-radius:99px;padding:1px 8px;margin:4px 6px 0 0;font-style:normal;text-decoration:none;white-space:nowrap;}
.s-pend{color:var(--s-pend);} .s-and{color:var(--s-and);} .s-pau{color:var(--s-pau);} .s-agu{color:var(--s-agu);} .s-ok{color:var(--s-ok);} .s-apr{color:var(--s-apr);} .s-cor{color:var(--s-cor);} .s-imp{color:var(--s-imp);} .s-pendsync{color:var(--mut);border-style:dashed;}
.tk{align-items:flex-start;}
.tbtn{flex:1;background:none;border:0;padding:0;text-align:left;font:inherit;font-size:17px;line-height:1.38;color:inherit;cursor:pointer;min-height:32px;}
.task.on .tbtn>span:first-child{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(119,115,106,.5);}
.tmeta{display:flex;flex-wrap:wrap;align-items:center;gap:0;color:var(--gold);}
.tmeta .who{font-size:12px;color:var(--mut);margin:4px 6px 0 0;}
.tmeta .ic{margin:4px 4px 0 0;color:var(--gold);}
.qbox{background:#fff;cursor:pointer;padding:0;}
.sbox{border-color:currentColor;} .sbox svg{opacity:1;}
.sbox.s-ok,.sbox.s-apr{background:currentColor;} .sbox.s-ok svg,.sbox.s-apr svg{color:#fff;}
.sbox.s-agu{background:#f6ecd9;} .sbox.s-agu svg{color:var(--s-agu);}
.sbox.s-and,.sbox.s-pau{border-style:dashed;}
.net{background:#e9e4d6;color:var(--gd);font-size:13px;text-align:center;padding:6px 10px;}
.net.off{background:var(--rustbg);color:var(--rust);}
.net a{color:inherit;font-weight:600;}
.bell{position:relative;}
.bell .badge{position:absolute;top:4px;right:2px;background:var(--rust);color:#fff;border-radius:99px;font-size:10.5px;min-width:18px;height:18px;display:grid;place-items:center;padding:0 4px;font-weight:600;}
.greet{font-family:var(--serif);font-size:30px;color:var(--gd);margin-top:14px;}
.frase{position:relative;background:var(--g);color:#fff;border-radius:14px;padding:14px 44px 14px 16px;margin-top:12px;}
.frase p{font-family:var(--serif);font-style:italic;font-size:17px;line-height:1.4;margin:6px 0 0;color:#f3efe4;}
.frase .fx{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:none;color:var(--gs);font-size:22px;cursor:pointer;border-radius:10px;}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.cnt div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;}
.cnt b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.1;}
.cnt span{font-size:13px;color:var(--mut);}
.dnav{display:flex;gap:6px;align-items:center;margin-top:12px;flex-wrap:wrap;}
.dnav .mini{width:44px;}
.dnav .dlab{flex:1;min-width:140px;position:relative;background:#fff;border:1px solid var(--line);border-radius:10px;min-height:44px;display:flex;align-items:center;justify-content:center;gap:8px;font-size:15px;}
.dnav .dlab input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;}
.dnav .btn{min-height:44px;font-size:14px;}
.big{min-height:56px;font-weight:600;letter-spacing:.04em;}
.btn.ok{background:var(--s-ok);border-color:var(--s-ok);color:#fff;}
.tsh .meta{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px;margin-top:6px;}
.tsh .meta b{font-weight:600;color:var(--mut);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding-top:2px;}
.tsh .box2{border-radius:10px;padding:10px 12px;margin-top:12px;font-size:15px;}
.tsh .box2.cor{background:var(--rustbg);border-left:3px solid var(--rust);}
.tsh .box2.info{background:var(--cream);border-left:3px solid var(--gold);}
.tsh h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:18px 0 6px;font-weight:600;}
.ckl label{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #f0ede5;font-size:16px;cursor:pointer;}
.ckl input{width:24px;height:24px;accent-color:var(--gold);flex:none;}
.ckl input:disabled+span{color:var(--mut);}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.cmp .col{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:8px;min-width:0;}
.cmp .col>b{display:block;font-size:11px;letter-spacing:.18em;color:var(--gold);margin-bottom:6px;}
.ph{display:block;width:100%;padding:0;border:0;background:#ddd8cc;border-radius:8px;overflow:hidden;cursor:zoom-in;aspect-ratio:4/3;}
.ph img{width:100%;height:100%;object-fit:cover;display:block;}
.phm{font-size:11.5px;color:var(--mut);margin:4px 0 8px;line-height:1.3;}
.phm.warn2{color:var(--rust);}
.phb{display:flex;gap:6px;flex-wrap:wrap;}
.phb .btn{min-height:42px;font-size:13px;flex:1;padding:0 8px;}
.hist2{list-style:none;margin:0;padding:0;font-size:14px;}
.hist2 li{padding:7px 0;border-bottom:1px solid #f0ede5;}
.hist2 small{color:var(--mut);display:block;}
.viewer{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:80;display:grid;place-items:center;}
.viewer img{max-width:100%;max-height:100%;object-fit:contain;}
.viewer button{position:absolute;top:calc(10px + env(safe-area-inset-top));right:10px;width:48px;height:48px;border-radius:12px;border:0;background:rgba(255,255,255,.15);color:#fff;font-size:26px;}
.icats{display:grid;gap:10px;margin-top:14px;}
.icat{display:flex;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;min-height:72px;cursor:pointer;text-align:left;width:100%;}
.icat .bi{width:44px;height:44px;border-radius:12px;background:var(--cream);display:grid;place-items:center;color:var(--gold);flex:none;}
.icat b{font-family:var(--serif);font-weight:400;font-size:19px;color:var(--gd);display:block;}
.icat small{font-size:13px;color:var(--mut);}
.iproc{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:14px 4px;min-height:56px;font-size:16px;cursor:pointer;}
.iproc:last-child{border-bottom:0;}
.iproc span{flex:1;}
.psec h4{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:0 0 8px;font-weight:600;}
.psec ul,.psec ol{margin:0;padding-left:20px;font-size:16px;}
.psec li{margin-bottom:6px;}
.psec ol.steps{list-style:none;padding:0;counter-reset:p;}
.psec ol.steps li{counter-increment:p;display:flex;gap:12px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #f0ede5;}
.psec ol.steps li::before{content:counter(p);width:28px;height:28px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;flex:none;font-size:14px;font-weight:600;}
.psec.no ul{color:var(--rust);}
.pimgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;}
.pimgs img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;}
.tdet{margin-top:10px;border-top:1px dashed var(--line);padding-top:6px;}
.tdet>summary{font-size:13px;color:var(--gold);cursor:pointer;padding:6px 0;min-height:36px;}
.ptab{width:100%;border-collapse:collapse;font-size:15px;}
.ptab td{padding:9px 4px;border-bottom:1px solid var(--line);}
.ptab td:last-child{text-align:right;font-family:var(--serif);font-size:20px;}
.ptab tr.hl td{color:var(--rust);}
.filt{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.notif{list-style:none;margin:0;padding:0;}
.notif li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;}
.notif li.new{font-weight:600;}
.notif small{display:block;color:var(--mut);font-weight:400;}
.empty2{color:var(--mut);font-style:italic;font-size:15px;margin:6px 0 0;}
/* listas comuns dentro das janelas: sem a numeração do passo a passo de instalação */
.sheet ul li{display:block;counter-increment:none;}
.sheet ul li::before{content:none;display:none;}
.sheet .psec li{padding:0;border:0;font-size:inherit;}
.sheet .psec ol.steps li{display:flex;padding:8px 0;border-bottom:1px solid #f0ede5;}
.sheet .psec ul{padding-left:20px;}
.netbtn{margin-left:8px;background:#fff;border:1px solid currentColor;color:inherit;border-radius:8px;padding:4px 10px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;min-height:32px;}
.draft{font-size:12.5px;color:var(--rust);margin-top:4px;}
@media print{.net,.frase,.dnav{display:none!important;}}

anização, validade e lista de compras · Sex: conferência e organização","status":"Definido","items":["Segunda: retirar os itens por prateleira, higienizar, verificar validade e condições de armazenamento.","Segunda: elaborar a lista de compras da semana.","Sexta: conferir e organizar para o fim de semana."]},{"id":"g2","section":"freq","title":"Roupas de cama","icon":"bed","meta":"1× por semana, por quarto · Ter: quarto do casal · Qua: quartos das crianças e quarto de visita","status":"A validar","items":["Trocar no dia da faxina de cada quarto, evitando concentrar toda a roupa de cama em um só dia.","Lavar conforme a etiqueta de cada peça."]},{"id":"g3","section":"freq","title":"Toalhas de banho","icon":"towel","meta":"3× por semana + sempre que necessário · Seg · Qua · Sex","status":"A validar","items":["Trocar no Bloco 03, junto com o recolhimento das roupas.","Substituição adicional sempre que necessário."]},{"id":"g4","section":"freq","title":"Toalhas do lavabo (se houver)","icon":"towel","meta":"Sempre que necessário · Conferência reforçada na quinta","status":"Definido","items":["Substituir sempre que necessário; conferir também lixeira e poeira do lavabo."]},{"id":"g5","section":"freq","title":"Vidros","icon":"window","meta":"1× por semana, por ambiente · Ter: quarto do casal · Qua: quartos das crianças e quarto de visita · Sex: salas e cozinha","status":"Definido","items":["Limpar os vidros antes do piso do ambiente, para que respingos não sujem o piso já limpo."]},{"id":"g6","section":"freq","title":"Armários internos","icon":"cabinet","meta":"1× por semana, em blocos de manutenção · Qua: armários, sala e despensa","status":"A validar","items":["Manutenção da organização interna — não é faxina profunda diária.","Somente armários autorizados pela família; respeitar a privacidade."]},{"id":"g7","section":"freq","title":"Aparador da cafeteira","icon":"coffee","meta":"Diário · Seg a Sex · Bloco 01 e conferência ao longo do dia","status":"Definido","items":["Conferir limpeza, abastecimento e organização."]},{"id":"g8","section":"freq","title":"Lavanderia","icon":"wash","meta":"Diário · Seg a Sex · início no Bloco 03, entrega no Bloco 07","status":"Definido","items":["Separar as roupas por tecido, cor e instruções de lavagem.","Lavar, secar e guardar adequadamente os panos de limpeza.","Não misturar panos de banheiro, cozinha e demais ambientes.","Não guardar peças ou calçados ainda úmidos.","Encerrar o dia com os equipamentos organizados."]},{"id":"g9","section":"amb","title":"Cozinha","icon":"plate","meta":"","items":["A cozinha é o primeiro ambiente do dia: o café da família vem antes de qualquer outra tarefa.","Depois do café, deixar bancadas livres para as atividades do almoço.","Piso da cozinha sempre por último na limpeza do ambiente."]},{"id":"g10","section":"amb","title":"Aparador da cafeteira","icon":"coffee","meta":"","items":["Conferir diariamente limpeza, abastecimento e organização.","Repetir a conferência ao passar pela cozinha e no encerramento."]},{"id":"g11","section":"amb","title":"Salas e ambientes sociais","icon":"door","meta":"","items":["Devem estar prontas todos os dias para receber pessoas. Se houver escritório em casa, deixá-lo pronto para uso.","Papéis e documentos de trabalho: alinhar sem ler, descartar ou mudar de lugar. Na dúvida, deixar como está e perguntar."]},{"id":"g12","section":"amb","title":"Quartos","icon":"bed","meta":"","items":["Organizar primeiro (camas, objetos, roupas), limpar depois — um ambiente organizado uma única vez.","Respeitar a privacidade: não abrir gavetas e armários sem autorização.","Guardar roupas passadas antes de limpar o piso."]},{"id":"g13","section":"amb","title":"Quarto do casal","icon":"bed","meta":"","items":["Faxina completa na terça, com vidros e troca da roupa de cama.","Closets, gavetas e criados-mudos somente com autorização; objetos pessoais e documentos permanecem onde estão."]},{"id":"g14","section":"amb","title":"Quartos das crianças (se houver)","icon":"bed","meta":"","items":["Faxina na quarta, com vidros e troca da roupa de cama.","Organizar brinquedos, livros e material escolar por categoria, cada item no seu lugar.","Produtos de limpeza nunca ficam ao alcance das crianças: guardar logo após o uso."]},{"id":"g15","section":"amb","title":"Quarto de visita (se houver)","icon":"bed","meta":"","items":["Faxina na quarta, com vidros; trocar a roupa de cama sempre que o quarto for usado.","Mesmo sem uso, retirar o pó e arejar, para que esteja sempre pronto para receber.","Antes do fim de semana ou de uma visita: cama feita, toalhas limpas e lixeira vazia."]},{"id":"g16","section":"amb","title":"Banheiros e lavabo","icon":"drop","meta":"","items":["Materiais do banheiro são exclusivos e não circulam por outros ambientes (circuito sanitário com kit exclusivo).","Panos separados por ambiente, com microfibras por cor. Definir as cores com a família.","Lavabo (se houver): poeira, lixeira e toalhas sempre conferidos — é o banheiro das visitas."]},{"id":"g17","section":"amb","title":"Lavanderia e panos","icon":"wash","meta":"","items":["Iniciar a primeira lavagem logo após recolher as roupas, para a máquina trabalhar enquanto a limpeza acontece.","Separar por tecido, cor e etiqueta; não misturar panos de banheiro, cozinha e demais ambientes.","Nunca guardar peças úmidas; encerrar o dia com bancadas, piso e equipamentos organizados."]},{"id":"g18","section":"amb","title":"Calçados","icon":"shoe","meta":"","items":["Limpar pela manhã para que sequem até o fim do expediente.","Guardar somente quando completamente secos; os úmidos permanecem em local ventilado."]},{"id":"g19","section":"amb","title":"Garagens, entradas e piscina (se houver)","icon":"home","meta":"","items":["Executar durante o café da família, sem interferir na circulação dos moradores.","Usar água somente quando adequado; na piscina, remover a poeira da área ao redor."]},{"id":"g20","section":"amb","title":"Área gourmet e churrasqueira (se houver)","icon":"flame","meta":"","items":["Segunda: limpeza após o almoço. Quinta: conforme a necessidade.","Sexta: conferida, organizada e pronta para uso no fim de semana."]},{"id":"g21","section":"amb","title":"Geladeira e despensa","icon":"fridge","meta":"","items":["Segunda: higienizar, verificar validade e preparar a lista de compras.","Sexta: conferir e organizar. Quarta: manutenção da organização da despensa."]},{"id":"g22","section":"princ","title":"Sequência de todos os dias","meta":"","items":["Preparar → Organizar → Executar a limpeza → Conferir → Finalizar"]},{"id":"g23","section":"princ","title":"O café da família vem primeiro","meta":"","items":["Ao chegar, a cozinha é preparada e o café servido antes de qualquer outra atividade."]},{"id":"g24","section":"princ","title":"Organizar antes de limpar","meta":"","items":["Camas, objetos, resíduos e roupas são resolvidos no Bloco 03. A limpeza do Bloco 04 encontra os ambientes livres — cada ambiente é organizado uma única vez."]},{"id":"g25","section":"princ","title":"Pisos sempre por último","meta":"","items":["Primeiro o que produz sujeira (pó, vidros, banheiros); o piso fecha a limpeza de cada ambiente."]},{"id":"g26","section":"princ","title":"A máquina trabalha enquanto você trabalha","meta":"","items":["A lavagem começa antes da limpeza principal; ao fim de cada ciclo, estender e iniciar a próxima."]},{"id":"g27","section":"princ","title":"Uma viagem à lavanderia","meta":"","items":["Roupas, toalhas e roupa de cama do dia são recolhidas juntas, evitando idas e vindas entre quartos e lavanderia."]},{"id":"g28","section":"princ","title":"Materiais por ambiente","meta":"","items":["Banheiro, cozinha e demais áreas com panos e utensílios próprios, sem contaminação cruzada."]},{"id":"g29","section":"princ","title":"O almoço tem hora protegida","meta":"","items":["Tarefas demoradas ficam antes do Bloco 05 ou depois da pausa do almoço, nunca encostadas no serviço da refeição."]},{"id":"g30","section":"princ","title":"Pausas fazem parte da rotina","meta":"","items":["A pausa do café e a do almoço da colaboradora estão previstas em todos os dias."]},{"id":"g31","section":"princ","title":"Discrição e privacidade","meta":"","items":["Escritório, quartos e armários são tratados com sigilo e só com autorização."]},{"id":"g32","section":"princ","title":"Conferir e registrar","meta":"","items":["O dia termina com a conferência final; o que não foi feito é registrado como pendência, não esquecido."]},{"id":"g33","section":"val","title":"Ambientes da casa","meta":"","items":["Conferir quais ambientes a casa tem: lavabo, área gourmet, churrasqueira, piscina, escritório. Tarefas de ambientes que a casa não tiver ficam sem marcar ou podem ser removidas no editor."]},{"id":"g34","section":"val","title":"Quartos","meta":"","items":["Confirmar quantos quartos de cada tipo a casa tem: quarto do casal (faxina na terça), quartos das crianças e quarto de visita (faxina na quarta). Se a casa não tiver algum deles, a tarefa fica sem marcar ou pode ser removida no editor."]},{"id":"g35","section":"val","title":"Roupas de cama","meta":"","items":["Troca no dia da faxina de cada quarto (terça e quarta); no quarto de visita, sempre que tiver sido usado."]},{"id":"g36","section":"val","title":"Toalhas de banho","meta":"","items":["Dias de referência sugeridos: segunda, quarta e sexta."]},{"id":"g37","section":"val","title":"Horários","meta":"","items":["Definir início e fim do expediente, horário do café e do almoço da família e duração das pausas da colaboradora."]},{"id":"g38","section":"val","title":"Preparo do almoço","meta":"","items":["A rotina prevê preparar a cozinha e a mesa; definir quem prepara a refeição."]},{"id":"g39","section":"val","title":"Roupas para passar","meta":"","items":["Terça separa as roupas para passar e quarta guarda as passadas — definir quem passa e em que momento."]},{"id":"g40","section":"val","title":"Dimensão da casa","meta":"","items":["Registrar metragem e número de quartos e banheiros, para estimar os tempos de cada bloco."]},{"id":"g41","section":"val","title":"Uso de água","meta":"","items":["Garagens, entradas e área da piscina (se houver): definir quando a lavagem com água é adequada."]},{"id":"g42","section":"val","title":"Armários internos","meta":"","items":["Definir quais armários a colaboradora pode abrir e organizar."]},{"id":"g43","section":"val","title":"Panos e produtos","meta":"","items":["Definir com a família as cores de panos por ambiente e os produtos por superfície."]},{"id":"g44","section":"val","title":"Lavanderia","meta":"","items":["Seguir as etiquetas das peças e as orientações da família."]},{"id":"g45","section":"val","title":"Calçados programados","meta":"","items":["Definir quais calçados entram em cada dia (terça a sexta)."]},{"id":"g46","section":"val","title":"Lixeiras","meta":"","items":["Definir a programação de limpeza das lixeiras."]},{"id":"g47","section":"val","title":"Lista de compras","meta":"","items":["Definir a quem a lista é entregue e em que formato."]}],"instr":{"cats":[{"id":"c1","nome":"Limpeza de pisos","icon":"spark","subs":[{"id":"c1s1","nome":"Rotina de limpeza"},{"id":"c1s2","nome":"Tipos de piso"}]},{"id":"c2","nome":"Produtos de limpeza","icon":"drop","subs":[{"id":"c2s1","nome":"Uso correto"},{"id":"c2s2","nome":"Segurança"}]},{"id":"c3","nome":"Limpeza de banheiros","icon":"towel","subs":[{"id":"c3s1","nome":"Limpeza completa"},{"id":"c3s2","nome":"Conferência"}]},{"id":"c4","nome":"Limpeza e conservação de calçados","icon":"shoe","subs":[{"id":"c4s1","nome":"Identificação e limpeza"},{"id":"c4s2","nome":"Secagem e conservação"}]},{"id":"c5","nome":"Produtos proibidos e cuidados","icon":"alert","subs":[{"id":"c5s1","nome":"Superfícies de alto padrão"},{"id":"c5s2","nome":"Acidentes e danos"}]}],"procs":[{"id":"p1","cat":"c1","sub":"c1s1","nome":"Limpeza diária de pisos","objetivo":"Remover pó e sujeira do piso sem danificar o revestimento e sem deixar marcas ou resíduos.","materiais":["Vassoura de pelo macio ou aspirador","Mop ou rodo com pano de microfibra","Dois baldes: um com a solução e outro com água limpa","Panos de microfibra separados por ambiente","Luvas de borracha","Placa de \"piso molhado\" quando houver circulação"],"produtos":["Detergente neutro ou limpador indicado pelo fabricante do piso","Diluição: exatamente a indicada no rótulo do produto"],"proibidos":["Misturar produtos de limpeza","Excesso de água em madeira e laminado","Palha de aço, saponáceo e esponjas abrasivas em pisos polidos","Cera em porcelanato sem indicação do fabricante"],"passos":["Retirar do caminho objetos soltos, tapetes e cadeiras leves.","Remover o pó e os resíduos com vassoura macia ou aspirador, começando pelos cantos e rodapés.","Preparar a solução no balde na diluição indicada no rótulo.","Umedecer e torcer bem o pano ou o mop: ele deve ficar úmido, não encharcado.","Limpar do fundo do ambiente em direção à saída, para não pisar no piso já limpo.","Enxaguar o pano no balde de água limpa sempre que estiver sujo e trocar a água quando turvar.","Secar com pano seco os pisos que marcam com água ou que ficam escorregadios.","Recolocar móveis e tapetes somente com o piso seco."],"cuidados":["Sinalizar o piso molhado e avisar quem estiver em casa.","Usar luvas ao manusear produtos.","Não arrastar móveis: levantar com ajuda quando necessário.","Mancha desconhecida: perguntar à responsável antes de testar qualquer produto."],"imagens":[],"videos":[],"criterios":["Piso sem pó, manchas ou marcas de pano","Sem poças de água","Cantos e rodapés limpos","Móveis e tapetes recolocados no lugar"],"checklist":["Pó removido, inclusive dos cantos","Solução preparada conforme o rótulo","Limpeza feita do fundo para a saída","Piso sem poças ou marcas de pano","Rodapés conferidos","Móveis e tapetes recolocados com o piso seco"],"validar":true,"fonte":"Conteúdo-base com orientações gerais de conservação e segurança. Validar com a responsável pela casa, com os rótulos dos produtos usados e com os manuais dos fabricantes dos revestimentos e objetos."},{"id":"p2","cat":"c1","sub":"c1s2","nome":"Como identificar o tipo de piso","objetivo":"Reconhecer o revestimento de cada ambiente antes de escolher o produto e o método de limpeza.","materiais":["Caderno ou o próprio app (Regras da casa) para anotar o piso de cada ambiente"],"produtos":[],"proibidos":[],"passos":["Perguntar à responsável pela casa qual é o piso de cada ambiente e anotar.","Pedras naturais (mármore, granito, travertino): desenhos e veios irregulares; o mármore costuma ser mais claro e marca com facilidade.","Porcelanato: peças grandes e uniformes, rejunte fino; pode ser polido (brilhante) ou acetinado/fosco.","Cerâmica: peças esmaltadas, normalmente menores, com rejunte mais aparente.","Madeira maciça, taco ou assoalho: emendas e veios naturais de madeira.","Laminado e vinílico: imitam madeira com padrão que se repete; o vinílico é mais macio e silencioso ao pisar.","Na dúvida, não testar produto no piso: perguntar antes."],"cuidados":["Nunca usar produto ácido ou abrasivo para \"descobrir\" o tipo de piso.","Em casas com pisos diferentes, deixar a informação de cada ambiente registrada."],"imagens":[],"videos":[],"criterios":["Tipo de piso de cada ambiente confirmado com a responsável e registrado"],"checklist":["Tipo de piso confirmado com a responsável","Informação registrada nas regras da casa"],"validar":true,"fonte":"Conteúdo-base com orientações gerais de conservação e segurança. Validar com a responsável pela casa, com os rótulos dos produtos usados e com os manuais dos fabricantes dos revestimentos e objetos."},{"id":"p3","cat":"c1","sub":"c1s2","nome":"Cuidados por tipo de piso","objetivo":"Aplicar o cuidado adequado a cada revestimento, preservando brilho, cor e acabamento.","materiais":["Panos de microfibra","Mop","Vassoura macia ou aspirador"],"produtos":["Detergente neutro diluído conforme o rótulo (uso geral)","Produtos específicos (para madeira, mármore, vinílico) somente quando indicados pelo fabricante e autorizados pela responsável"],"proibidos":["Ácidos (vinagre, limão, removedores de ferrugem e de rejunte) em mármore, granito e outras pedras","Abrasivos em pisos polidos, pedras e vinílico","Água em excesso em madeira e laminado","Solventes e produtos à base de petróleo em vinílico","Cera e produtos que formam película sem orientação do fabricante"],"passos":["Porcelanato: detergente neutro diluído, pano bem torcido; secar se ficar marcado.","Mármore e pedras claras: somente produto neutro ou próprio para mármore; secar logo depois. Ácidos mancham e corroem a pedra.","Granito: produto neutro; evitar ácidos e abrasivos, que tiram o brilho.","Madeira (maciça, taco, assoalho): retirar o pó primeiro; pano apenas úmido e bem torcido ou produto próprio para madeira; nunca jogar água; secar na hora.","Laminado: pouca água e pano bem torcido; não usar cera.","Vinílico: detergente neutro diluído; nada de solventes ou removedores.","Cerâmica: detergente neutro; no rejunte, escova de cerdas macias."],"cuidados":["Estas são orientações gerais: a orientação do fabricante do piso e do produto sempre prevalece.","Ceras, impermeabilizantes e removedores só com autorização da responsável."],"imagens":[],"videos":[],"criterios":["Produto escolhido de acordo com o piso","Nenhuma mancha nova, perda de brilho ou risco","Piso seco ao final"],"checklist":["Tipo de piso conferido","Produto compatível com o piso","Água em quantidade mínima em madeira e laminado","Piso seco ao final"],"validar":true,"fonte":"Conteúdo-base com orientações gerais de conservação e segurança. Validar com a responsável pela casa, com os rótulos dos produtos usados e com os manuais dos fabricantes dos revestimentos e objetos."},{"id":"p4","cat":"c2","sub":"c2s1","nome":"Como usar produtos de limpeza com segurança","objetivo":"Usar cada produto para a finalidade certa, na diluição indicada pelo fabricante e com proteção.","materiais":["Luvas de borracha","Óculos de proteção ao manusear produtos concentrados, quando o rótulo indicar","Borrifadores identificados com o nome do produto","Medidor ou tampa dosadora"],"produtos":["Detergente neutro: limpeza geral de pisos, bancadas e superfícies laváveis","Desinfetante: desinfecção de pisos e sanitários, conforme o rótulo","Água sanitária: desinfecção de louças sanitárias e de áreas indicadas no rótulo, sempre diluída","Limpa-vidros: vidros e espelhos","Multiuso: somente nas superfícies indicadas no rótulo","Álcool 70%: superfícies pequenas indicadas no rótulo; é inflamável"],"proibidos":["Misturar produtos","Reaproveitar embalagens de alimentos ou bebidas","Usar mais produto do que o indicado"],"passos":["Ler o rótulo antes de usar: finalidade, modo de uso, diluição e cuidados.","Usar a diluição indicada pelo fabricante: mais produto não limpa mais e pode manchar ou deixar resíduo.","Diluir conforme o rótulo; quando não houver outra instrução, colocar primeiro a água e depois o produto.","Identificar borrifadores e frascos com o nome do produto.","Em superfície nova ou delicada, testar em um ponto escondido, com autorização.","Manter o ambiente ventilado durante e depois do uso.","Fechar e guardar o produto logo após o uso."],"cuidados":["Usar luvas sempre.","Produtos na embalagem original, longe de alimentos, do calor e do alcance de crianças e animais.","Confirmar com a responsável quais produtos e marcas são usados na casa."],"imagens":[],"videos":[],"criterios":["Produto adequado à superfície","Diluição conforme o rótulo","Produtos guardados e frascos identificados"],"checklist":["Rótulo lido","Diluição conforme o fabricante","Frasco identificado","Ambiente ventilado","Produto guardado após o uso"],"validar":true,"fonte":"Conteúdo-base com orientações gerais de conservação e segurança. Validar com a responsável pela casa, com os rótulos dos produtos usados e com os manuais dos fabricantes dos revestimentos e objetos."},{"id":"p5","cat":"c2","sub":"c2s2","nome":"Produtos que nunca devem ser misturados","objetivo":"Evitar intoxicações e acidentes causados pela mistura de produtos de limpeza.","materiais":[],"produtos":[],"proibidos":["Água sanitária (cloro) + amoníaco ou produtos com amônia: libera gases tóxicos","Água sanitária + produtos ácidos (vinagre, removedores de ferrugem, alguns limpadores de vaso e de rejunte): libera gás cloro, tóxico","Água sanitária + álcool: forma compostos tóxicos","Desinfetantes ou limpadores diferentes entre si: reação imprevisível"],"passos":["Usar um produto de cada vez.","Enxaguar a superfície com água antes de aplicar outro produto.","Não aplicar produtos diferentes em sequência no mesmo vaso sanitário ou ralo sem enxaguar.","Em caso de mistura acidental: sair do ambiente, abrir janelas se for seguro e não tentar neutralizar.","Avisar imediatamente a responsável pela casa.","Em caso de mal-estar, contato com os olhos ou ingestão: procurar atendimento médico levando o rótulo do produto (SAMU 192; Disque-Intoxicação da Anvisa 0800 722 6001 — confirmar o número vigente)."],"cuidados":["Nunca misturar produtos \"para potencializar\" a limpeza.","Não guardar restos de solução preparada em garrafas sem identificação."],"imagens":[],"videos":[],"criterios":["Nenhum produto misturado","Produtos usados um de cada vez, com enxágue entre eles"],"checklist":["Um produto de cada vez","Enxágue entre produtos diferentes","Ambiente ventilado"],"validar":true,"fonte":"Conteúdo-base com orientações gerais de conservação e segurança. Validar com a responsável pela casa, com os rótulos dos produtos usados e com os manuais dos fabricantes dos revestimentos e objetos."},{"id":"p6","cat":"c2","sub":"c2s2","nome":"Armazenamento seguro de produtos","objetivo":"Guardar os produtos de forma segura, preservando a validade e evitando acidentes.","materiais":[],"produtos":[],"proibidos":[],"passos":["Manter cada produto na embalagem original, bem fechada e com o rótulo legível.","Guardar em local ventilado, fresco e protegido d antes dos revestimentos e objetos."},{"id":"p13","cat":"c4","sub":"c4s2","nome":"Secagem, armazenamento e quando chamar um profissional","objetivo":"Conservar os calçados por mais tempo e evitar mofo, deformação e danos.","materiais":[],"produtos":[],"proibidos":[],"passos":["Secar sempre à sombra e em local ventilado.","Guardar somente quando estiverem completamente secos.","Usar formas ou papel para manter o formato.","Guardar em local arejado, de preferência em sacos de tecido que deixem o ar circular.","Separar os calçados de uso diário dos de uso eventual."],"cuidados":["Encaminhar a profissional: couros exóticos, calçados de alto valor, manchas de tinta ou óleo, descoloração e danos em costura ou solado — sempre com autorização da responsável."],"imagens":[],"videos":[],"criterios":["Calçados secos, com formato preservado e guardados no lugar definido"],"checklist":["Completamente secos","Formato preservado","Guardados em local arejado"],"validar":true,"fonte":"Conteúdo-base com orientações gerais de conservação e segurança. Validar com a responsável pela casa, com os rótulos dos produtos usados e com os manuais dos fabricantes dos revestimentos e objetos."},{"id":"p14","cat":"c5","sub":"c5s1","nome":"Produtos inadequados por tipo de material","objetivo":"Prevenir danos permanentes a superfícies e acabamentos de alto padrão.","materiais":[],"produtos":[],"proibidos":["Mármore e pedras claras: ácidos (vinagre, limão), abrasivos e produtos não indicados para pedra","Granito: ácidos e abrasivos","Madeira e móveis laqueados: excesso de água, álcool, solventes e multiuso sem indicação","Inox: palha de aço, saponáceo e cloro (podem riscar e manchar)","Vidros e espelhos: abrasivos","Acrílico: álcool e abrasivos (riscam e deixam opaco)","Couro de móveis: álcool e solventes","Metais dourados ou banhados: abrasivos e ácidos"],"passos":["Antes de limpar, identificar o material da superfície.","Na dúvida, usar apenas pano seco ou levemente úmido com água e perguntar à res const APP_VERSION = "3.1.0";

/* ---------- utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const icon = (n, cls="ic") => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]||""}</svg>`;
const CHECK = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>`;
const CHEV = `<svg class="ic chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>`;
const TAGS = {fixo:"Fixo", prior:"Prioridade", pausa:"Pausa", ciclo:"Lavanderia"};
const WEEK = ["seg","ter","qua","qui","sex","sab","dom"];
const ICON_CHOICES = ["cup","door","basket","spark","plate","list","check","fridge","bed","towel","window","cabinet","coffee","wash","shoe","home","flame","drop","star","clock","calendar","book","alert"];
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
// meio-dia: soma e subtração de dias corretas em qualquer mês (28 a 31 dias) e sem efeito de horário de verão
const parseISO = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d, 12); };
const weekdayId = iso => WEEK[(parseISO(iso).getDay()+6)%7];
const addDays = (iso, n) => { const d = parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const mondayOf = iso => addDays(iso, -WEEK.indexOf(weekdayId(iso)));
const dateOfWeekday = (iso, id) => addDays(mondayOf(iso), WEEK.indexOf(id));
const fmtDate = (iso, opts={weekday:"long", day:"2-digit", month:"long", year:"numeric"}) => parseISO(iso).toLocaleDateString("pt-BR", opts);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const dm = iso => fmtDate(iso, {day:"2-digit", month:"2-digit"});
const uid = () => Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const clone = o => JSON.parse(JSON.stringify(o));
const slug = s => String(s).normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^\w]+/g,"_").replace(/^_|_$/g,"") || "casa";

/* ---------- dados: casas, rotinas e registros ---------- */
const KEY = "rotinaGeral.app.v2", OLD_KEY = "casaArmando.rotina.v1";
let storageOK = true, DB = null;

// garante os campos da versão 3 em casas criadas por versões anteriores
function normalizeHouse(h){
  if (!h.instr || !Array.isArray(h.instr.cats)) h.instr = clone(SEED.instr);
  if (!Array.isArray(h.frases) || h.frases.length !== 31) h.frases = SEED.frases.slice();
  if (!Array.isArray(h.extras)) h.extras = [];
  if (!Array.isArray(h.ambientes)) h.ambientes = SEED.ambientes.slice();
  if (!h.tz) h.tz = SEED.tz;
  if (!Array.isArray(h.guides)) h.guides = [];
  if (!Array.isArray(h.closing)) h.closing = [];
  delete h.sync; // o compartilhamento por código (v2.1) foi substituído pela residência conectada
  return h;
}
function houseFromSeed(name){ const h = clone(SEED); h.id = uid(); if (name) h.name = name; h.created = Date.now(); return h; }
function blankHouse(name){
  return normalizeHouse({ id:uid(), name, subtitle:SEED.subtitle, created:Date.now(), closingResult:SEED.closingResult,
    days: SEED.days.map(d => ({id:d.id, abbr:d.abbr, name:d.name, active:!["sab","dom"].includes(d.id), focus:"", goal:"", priorities:[], blocks:[]})),
    closing:[], guides:[] });
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch(e){ storageOK = false; }
  try { DB = raw ? JSON.parse(raw) : null; } catch(e){ DB = null; }
  if (!DB || !Array.isArray(DB.houses) || !DB.houses.length) {
    const h = clone(SEED); h.id = "casa-1"; h.created = Date.now();
    DB = {v:2, current:h.id, houses:[h], records:{[h.id]:{}}, pin:""};
    // traz as marcações da versão 1 (mesmo endereço) — os códigos das tarefas foram preservados
    let migrated = false;
    try { const old = JSON.parse(localStorage.getItem(OLD_KEY) || "null"); if (old && old.records) { DB.records[h.id] = old.records; migrated = true; } } catch(e){}
    // instalação nova: o app pergunta o nome da casa ou do cliente na primeira abertura
    if (!migrated) { h.name = "Minha casa"; DB.needsName = true; }
    save();
  }
  if (!DB.records) DB.records = {};
  for (const k of ["auth", "exec", "notif", "resid", "sum"]) if (!DB[k] || typeof DB[k] !== "object") DB[k] = {};
  if (!Array.isArray(DB.queue)) DB.queue = [];
  DB.houses.forEach(normalizeHouse);
  // cache local de execuções: mantém só os últimos 60 dias (o histórico completo fica no servidor)
  const limite = addDays(isoOf(new Date()), -60);
  for (const hid of Object.keys(DB.exec)) for (const d of Object.keys(DB.exec[hid])) if (d < limite) delete DB.exec[hid][d];
  if (!DB.houses.some(h => h.id === DB.current)) DB.current = DB.houses[0].id;
}
function persist(){
  try { localStorage.setItem(KEY, JSON.stringify(DB)); storageOK = true; }
  catch(e){ storageOK = false; }
}
function save(){ persist(); }
let saveT = null;
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 250); }
const H = () => DB.houses.find(h => h.id === DB.current);
const RECS = () => (DB.records[DB.current] ||= {});
const activeDays = () => H().days.filter(d => d.active);
const dayById = id => H().days.find(d => d.id === id);
const dayNum = d => pad(activeDays().indexOf(d) + 1);

// blocos de um dia da semana numa data: atividades extraordinárias da data + blocos + conferência final
// (mesma regra do servidor: dia inativo não tem tarefas recorrentes)
function blocksOf(dayId, date = S.date){
  const h = H(), d = dayById(dayId), out = [];
  const ex = (h.extras || []).filter(x => x.data === date && (x.t||"").trim());
  if (ex.length) out.push({id:"x", label:"Extra", code:"EXTRA", name:"Atividades extraordinárias", when:"Somente em " + dm(date),
    icon:"star", time:"", result:"", tasks:ex.map(x => ({...x, extra:true}))});
  if (d && d.active) {
    d.blocks.forEach((b,i) => out.push({...b, label:"Bloco " + pad(i+1), code:"B" + pad(i+1), tasks:b.tasks.filter(t => (t.t||"").trim())}));
    const cl = h.closing.filter(c => (c.t||"").trim());

/* comunicação com o servidor */
async function call(method, path, body, opts = {}){
  const h = opts.h || H(), a = h && DB.auth[h.id];
  const headers = Object.assign({}, opts.headers || {});
  if (a && a.token && !opts.anon) headers.Authorization = "Bearer " + a.token;
  let payload;
  if (body instanceof Blob) payload = body;
  else if (body !== undefined) { headers["Content-Type"] = "application/json"; payload = JSON.stringify(body); }
  let r;
  try { r = await fetch(API + path, {method, headers, body:payload, cache:"no-store"}); }
  catch(e){ const err = new Error("Sem conexão com a internet."); err.offline = true; throw err; }
  if (r.ok && opts.blob) return r.blob();
  let data = null;
  if ((r.headers.get("content-type") || "").includes("json")) { try { data = await r.json(); } catch(_){} }
  if (!r.ok) {
    const err = new Error((data && data.erro) || (r.status === 404 ? "O servidor da residência não respondeu. Confira se o app foi publicado com a função da API." : `Erro ${r.status} no servidor.`));
    err.status = r.status; err.data = data;
    if (r.status === 401 && a && !opts.anon) { a.expirado = true; persist(); }
    throw err;
  }
  return data;
}

  const h = H(); if (!conn(h) || pulling || DB.auth[h.id].expirado) return;

    DB.resid[h.id] = d.residencia; DB.auth[h.id].eu = d.eu;
    if (d.rotina && !h.remote.dirty) { applyRoutine(h, d.rotina, d.rotinaRev); changed = true; }
    if (d.dia) { DB.exec[h.id][date] = {rev:d.diaRev, tarefas:d.dia.tarefas || {}, obs:d.dia.obs}; changed = true; }
    const antes = DB.notif[h.id];

    else if (e.status === 401) refresh();

function enqueue(a){

let flushing = false;
async function flush(){
  if (flushing) return;
  flushing = true;
  let mudou = false;
  try {
    while (DB.queue.length) {
      const a = DB.queue[0], h = DB.houses.find(x => x.id === a.hid);
      if (!h || !conn(h)) { DB.queue.shift(); continue; }
      if (DB.auth[h.id].expirado) break;
      try {
        let res;
        if (a.tipo === "foto") {
          const blob = await idb.get(a.key);
          if (!blob) { DB.queue.shift(); continue; }
          res = await call("POST", "/foto", blob, {h, headers:{"Content-Type":blob.type || "image/jpeg", "X-Acao":a.id, "X-Data":a.data, "X-Tarefa":a.tarefa, "X-Tipo":a.fotoTipo, "X-Origem":a.origem}});
        } else {
          res = await call("POST", "/acao", {id:a.id, tipo:a.tipo, data:a.data, tarefa:a.tarefa, txt:a.txt, item:a.item, valor:a.valor, leu:a.leu, base:a.base, forcar:a.forcar}, {h});
          if (a.tipo === "obs") { const k = `${a.hid}|${a.data}|${a.tarefa}`; if (drafts()[k] === a.txt) setDraft(k, null); }
        }
        DB.queue.shift();
        if (a.tipo === "foto") { const k = "L" + a.key; if (PH[k]) { const f = res.tarefa.fotos.find(x => x.acao === a.id); if (f) PH[f.id] = PH[k]; } idb.del(a.key); }
        const ex = execDay(h.id, a.data);
        if (res.tarefa) ex.tarefas[res.tarefa.id] = res.tarefa;
        if (res.obs !== undefined) ex.obs = res.obs;
        ex.rev = -1; // força a releitura do dia: outras tarefas podem ter mudado em outro aparelho
        S.online = true; mudou = true; persist();
      } catch(e) {
        if (e.offline || e.status >= 500 || e.status === 429) { if (e.offline) S.online = false; break; }
        if (e.status === 401) break;
        DB.queue.shift(); if (a.tipo === "foto") idb.del(a.key);
        persist(); mudou = true;
        // duas pessoas na mesma observação: nada é sobrescrito em silêncio e o texto digitado não se perde
        if (e.status === 409 && e.data && e.data.conflito && a.tipo === "obs") { openConflict(a, e.data.conflito); continue; }
        toast("Não foi salvo: " + e.message);

    }
  } finally {
    flushing = false;
    refresh();
    if (mudou) pull();
  }
}

function taskRec(date, t){

  const pend = DB.queue.filter(a => a.hid === h.id && a.data === date && a.tarefa === t.id);

  for (const a of pend) switch (a.tipo) {

/* fotografias: compressão, fila local (IndexedDB) e exibição autenticada */
const idb = (() => {
  let p;
  const open = () => p ||= new Promise((res, rej) => { const r = indexedDB.open("rotina-geral", 1); r.onupgradeneeded = () => r.result.createObjectStore("fotos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const tx = async (mode, fn) => { const db = await open(); return new Promise((res, rej) => { const t = db.transaction("fotos", mode); const q = fn(t.objectStore("fotos")); t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error); }); };
  return {put:(k, v) => tx("readwrite", s => s.put(v, k)), get:k => tx("readonly", s => s.get(k)), del:k => tx("readwrite", s => s.delete(k))};
})();
function loadImg(file){ return new Promise((res, rej) => { const u = URL.createObjectURL(file); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = rej; i.src = u; }); }
async function compress(file, max, q){
  const img = await loadImg(file), s = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return await new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("imagem")), "image/jpeg", q));
}

function taskAction(tipo){
  const t = findTask(S.openTask), date = S.date; if (!t) return;
  const a = {tipo, data:date, tarefa:t.id}, r = taskRec(date, t), nivel = +t.nivel || 1;
  if (t.procObrig && ["iniciar","registrar"].includes(tipo) && ["pendente","correcao"].includes(r.status)) {
    if (!S.leu[date + t.id]) { toast("Abra as instruções e confirme a leitura antes de iniciar."); return; }
    a.leu = true;
  }
  if (tipo === "devolver") { const m = (($("#tk-motivo") || {}).value || "").trim(); if (m.length < 5) { toast("Descreva objetivamente o que precisa ser corrigido."); return; } a.txt = m; }
  if (tipo === "obs") { a.txt = (($("#tk-obs") || {}).value || "").trim(); a.base = (execDay(H().id, date).tarefas[t.id] || {}).obsEm || 0; setDraft(draftKey(date, t.id), a.txt); }
  if (["duvida","impossivel","pausar"].includes(tipo)) {
    const p = prompt(tipo === "duvida" ? "Qual é a sua dúvida sobre esta atividade?" : tipo === "impossivel" ? "Por que não foi possível realizar a atividade?" : "Motivo da pausa (opcional):", "");
    if (p === null) return;
    if (tipo !== "pausar" && p.trim().length < 3) { toast("Escreva um pouco mais, por favor."); return; }
    a.txt = p.trim();
  }
  if (tipo === "registrar") {
    const cl = t.checklist || [];
    if ((nivel === 2 || nivel === 4) && !cl.every((_, i) => r.checklist && r.checklist[i])) { toast("Confirme todos os itens do checklist antes de enviar."); return; }
    if (nivel >= 3) {
      const f = (r.fotos || []).filter(x => x.ciclo === (r.ciclo || 1));
      if (!f.some(x => x.tipo === "depois")) { toast("Tire a foto DEPOIS antes de enviar."); return; }
      if (t.fotoAntes && !f.some(x => x.tipo === "antes")) { toast("Falta a foto ANTES."); return; }
    }
  }
  if (tipo === "aprovar" && !confirm(`Aprovar "${t.t}"?`)) return;
  if (tipo === "reabrir" && !confirm(isAdm() ? "Reabrir esta atividade?" : "Desfazer o seu registro desta atividade?")) return;
  enqueue(a);
  const msg = {iniciar:"Atividade iniciada", registrar: nivel >= 3 ? "Enviada para verificação" : "Execução registrada", aprovar:"Atividade aprovada", devolver:"Correção solicitada",
    pausar:"Atividade pausada", retomar:"Atividade retomada", reabrir:"Atividade reaberta", impossivel:"Informação enviada à responsável", duvida:"Pedido de orientação enviado", obs:"Observação salva"}[tipo];
  toast(msg + (S.online ? "" : " · será enviado quando houver internet"));
}

/* entrada, convite e conexão da residência */
function adoptSession(casa, token, eu, nomeResid){
  let h = DB.houses.find(x => x.remote && x.remote.casa === casa);
  if (!h) {
    const only = DB.houses[0];
    if (DB.needsName && DB.houses.length === 1 && !Object.keys(DB.records[only.id] || {}).length) { DB.houses = []; delete DB.records[only.id]; }
    h = blankHouse(nomeResid || "Residência"); h.id = "r_" + casa; h.remote = {casa, rev:-1};
    DB.houses = DB.houses.filter(x => x.id !== h.id); DB.houses.push(h);
  }
  delete DB.needsName;
  DB.auth[h.id] = {token, eu};
  DB.current = h.id; S.askedName = true; S.online = true;
  persist();
  return h;
}

function counters(date, day){
  const ts = allTasks(day, date);
  if (!conn()) { const done = ts.filter(t => isDone(date, day, t)).length; return [["Programadas", ts.length], ["Pendentes", ts.length - done], ["Concluídas", done]]; }
  const c = {}; for (const k of Object.keys(ST)) c[k] = 0;
  let atras = 0;
  for (const t of ts) { const r = taskRec(date, t); c[r.status]++; if (isLate(t, r, date)) atras++; }
  const out = [["Programadas", ts.length], ["Pendentes", c.pendente], ["Em andamento", c.andamento + c.pausada], ["Aguardando verificação", c.aguardando],
    ["Concluídas", c.concluida], ["Aprovadas", c.aprovada], ["Em correção", c.correcao]];
  if (c.impossivel) out.push(["Não realizadas", c.impossivel]);
  if (atras) out.push(["Atrasadas", atras]);
  return out;
}

const edDay = () => { const m = location.hash.match(/editar\/(\w+)/); return m ? m[1] : null; };
function applyEdit(path, el){
  const h = H(), parts = path.split("."), val = el.type === "checkbox" ? el.checked : el.value;
  touch();
  if (parts[0] === "h") { h[parts[1]] = val; saveSoon(); return; }
  if (parts[0] === "c") { h.closing[+parts[1]].t = val; saveSoon(); return; }
  const d = dayById(edDay()); if (!d) return;
  if (parts[0] === "active") { d.active = val; save(); rerenderKeepScroll(); return; }
  if (parts[0] === "focus" || parts[0] === "goal") d[parts[0]] = val;
  else if (parts[0] === "prio") d.priorities = val.split("\n").map(s => s.trim()).filter(Boolean);
  else if (parts[0] === "b") {
    const b = d.blocks[+parts[1]];
    if (parts[2] === "t") {
      const t = b.tasks[+parts[3]], f = parts[4];
      if (f === "t") t.t = val;
      else if (f === "fotoAntes" || f === "procObrig") { if (val) t[f] = true; else delete t[f]; }
      else if (f === "nivel") { const n = +val; if (n > 1) t.nivel = n; else delete t.nivel; }
      else if (f === "min") { const n = Math.round(+val); if (n > 0) t.min = n; else delete t.min; }
      else if (f === "checklist") { const l = val.split("\n").map(s => s.trim()).filter(Boolean); if (l.length) t.checklist = l; else delete t.checklist; }
      else if (String(val).trim()) t[f] = val; else delete t[f];
    } else b[parts[2]] = val;
  }
  saveSoon();
}
function edAction(act, el){
  const h = H(), d = dayById(edDay()), i = +el.dataset.i, j = +el.dataset.j;
  const mv = (arr, a, b) => { if (b < 0 || b >= arr.length) return; const [x] = arr.splice(a, 1); arr.splice(b, 0, x); };
  switch (act) {
    case "addBlock": { const b = {id:uid(), name:"Novo bloco", when:"", time:"", icon:"list", result:"", tasks:[]}; d.blocks.push(b); S.edOpen[b.id] = true; S.focusSel = `[data-e="b.${d.blocks.length-1}.name"]`; break; }
    case "delB": if (!confirm(`Excluir o bloco "${d.blocks[i].name}" e suas ${d.blocks[i].tasks.length} tarefas?`)) return; d.blocks.splice(i, 1); break;
    case "upB": mv(d.blocks, i, i-1); break;
    case "downB": mv(d.blocks, i, i+1); break;
    case "addT": d.blocks[i].tasks.push({id:uid(), t:""}); S.edOpen[d.blocks[i].id] = true; S.focusSel = `[data-e="b.${i}.t.${d.blocks[i].tasks.length-1}.t"]`; break;
    case "delT": { const t = d.blocks[i].tasks[j]; if (t.t.trim() && !confirm(`Excluir a tarefa "${t.t}"?`)) return; d.blocks[i].tasks.splice(j, 1); break; }
    case "upT": mv(d.blocks[i].tasks, j, j-1); break;
    case "downT": mv(d.blocks[i].tasks, j, j+1); break;
    case "addC": h.closing.push({id:uid(), t:""}); S.focusSel = `[data-e="c.${h.closing.length-1}"]`; break;
    case "delC": h.closing.splice(i, 1); break;
    case "upC": mv(h.closing, i, i-1); break;
    case "clFromProc": {
      const t = d.blocks[i].tasks[j], p = t.proc && procById(t.proc);
      if (!p || !p.checklist.length) { toast("Escolha um procedimento que tenha checklist."); return; }
      t.checklist = p.checklist.slice(); toast("Checklist do procedimento copiado"); break;
    }
    case "copyDay": {
      const src = dayById($("#copysrc").value); if (!src) return;
      if (!confirm(`Substituir a rotina de ${d.name} por uma cópia de ${src.name}? O histórico já registrado é mantido.`)) return;
      const c = clone(src);
      Object.assign(d, {focus:c.focus, goal:c.goal, priorities:c.priorities, active:true,
        blocks:c.blocks.map(b => ({...b, id:uid(), tasks:b.tasks.map(t => ({...t, id:uid()}))}))});
      toast("Rotina copiada"); break;
    }
  }
  touch(); save(); rerenderKeepScroll();
}

function procSave(id){
  const I = H().instr, v = k => $("#pe-" + k).value, lines = k => v(k).split("\n").map(s => s.trim()).filter(Boolean);
  const nome = v("nome").trim(); if (nome.length < 3) { toast("Informe o nome do procedimento."); return; }
  const videos = lines("videos").filter(u => /^https:\/\//i.test(u));
  if (videos.length !== lines("videos").length) toast("Somente links https foram mantidos nos vídeos.");
  let sub = v("sub"); const cat = v("cat");
  const subOk = (catById(cat) || {subs:[]}).subs.some(s => s.id === sub); if (!subOk) sub = "";
  const data = {cat, sub, nome, objetivo:v("objetivo").trim(), materiais:lines("materiais"), produtos:lines("produtos"), proibidos:lines("proibidos"), passos:lines("passos"),
    cuidados:lines("cuidados"), criterios:lines("criterios"), checklist:lines("checklist"), videos, imagens:S.procImgs.list.slice(), validar:$("#pe-validar").checked, fonte:v("fonte").trim()};
  let p = id && procById(id);
  if (p) Object.assign(p, data); else { p = {id:"p" + uid(), ...data}; I.procs.push(p); }
  S.procImgs = null; touch(); save(); toast("Procedimento salvo"); go("#/instrucoes/p/" + p.id);
}
$("#imgin").addEventListener("change", async e => {
  const f = e.target.files[0]; e.target.value = "";
  if (!f || !S.procImgs) return;
  try {
    const blob = await compress(f, 900, 0.62);

function weekText(){
  const mon = mondayOf(S.date), wk = weekProgress(S.date), L = [];
  L.push(`${H().name.toUpperCase()} — RELATÓRIO DA SEMANA`, "Gisele Oliveira · Personal Organizer de Alto Padrão", "");
  L.push(`Semana de ${fmtDate(mon,{day:"2-digit",month:"2-digit",year:"numeric"})} a ${fmtDate(addDays(mon,6),{day:"2-digit",month:"2-digit",year:"numeric"})}`);
  L.push(`Concluídas na semana: ${wk.done} de ${wk.total} (${wk.pct}%)`, "");

const isMobile = () => /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent) || isIOS();
function download(blob, name){
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
async function shareText(text, name, title){
  if (navigator.share && isMobile()) {
    try { await navigator.share({title, text}); return; }
    catch(err){ if (err && err.name === "AbortError") return; }
  }
  try { download(new Blob([text], {type:"text/plain;charset=utf-8"}), name); toast("Relatório exportado"); }
  catch(err) {
    try { await navigator.clipboard.writeText(text); toast("Relatório copiado para a área de transferência"); }
    catch(_) { alert(text); }
  }
}
async function shareJSON(obj, name, title){
  const file = new File([JSON.stringify(obj)], name, {type:"application/json"});
  if (isMobile() && navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title}); return; }
    catch(err){ if (err && err.name === "AbortError") return; }
  }
  download(file, name); toast("Arquivo salvo");
}
function importFile(file){
  const fr = new FileReader();
  fr.onload = () => {
    let data; try { data = JSON.parse(fr.result); } catch(e){ toast("Arquivo inválido"); return; }
    if (data && data.type === "rotina-geral/casa" && data.house && Array.isArray(data.house.days)) {
      const h = normalizeHouse(data.house); delete h.remote;
      const ex = DB.houses.findIndex(x => x.id === h.id);
      if (ex >= 0 && conn(DB.houses[ex])) { toast("Esta casa está conectada: a rotina dela é atualizada pelo servidor, não por arquivo."); return; }
      if (ex >= 0) {
        if (!confirm(`Atualizar a rotina de "${DB.houses[ex].name}" com o arquivo recebido? As marcações já feitas neste aparelho são mantidas.`)) return;
        DB.houses[ex] = h;
      } else { DB.houses.push(h); DB.records[h.id] = DB.records[h.id] || {}; }
      delete DB.needsName; DB.current = h.id; save(); route(); toast(`Rotina de ${h.name} importada`);
    } else if (data && data.type === "rotina-geral/backup" && data.db && Array.isArray(data.db.houses)) {
      if (!confirm(`Restaurar o backup de ${new Date(data.exported).toLocaleString("pt-BR")}? Todas as casas e marcações deste aparelho serão substituídas pelas do arquivo.`)) return;
      DB = data.db; if (!DB.records) DB.records = {};
      for (const k of ["auth", "exec", "notif", "resid", "sum"]) DB[k] = DB[k] || {};
      if (!Array.isArray(DB.queue)) DB.queue = [];
      DB.houses.forEach(normalizeHouse);
      if (!DB.houses.some(h => h.id === DB.current)) DB.current = DB.houses[0].id;
      save(); route(); toast("Backup restaurado");
    } else toast("Este arquivo não é uma rotina nem um backup do app");
  };
  fr.readAsText(file);
}

/* conflito: outra pessoa alterou a mesma observação depois da versão que esta pessoa viu */
function openConflict(a, conflito){
  S.conflito = {a, conflito};
  const dia = a.tarefa === "_dia", t = !dia && findTask(a.tarefa, a.data), quem = conflito.nome || "Outra pessoa";
  removeSheet();
  openSheet(`<div class="kick" style="color:var(--rust)">Não foi salvo</div><h3>${esc(quem)} alterou ${dia ? "a observação do dia" : "esta observação"}</h3>
    <p class="help" style="margin-top:0">${t ? esc(t.t) + " · " : ""}${esc(fmtDate(a.data, {day:"2-digit", month:"2-digit"}))}. A alteração de ${esc(quem)} foi feita às ${esc(hhmm(conflito.em))}, depois da versão que você estava vendo. Nada foi perdido: escolha o que fazer.</p>
    <div class="tsh"><div class="box2 info"><b>Versão de ${esc(quem)} (mais recente no servidor):</b><br>${esc(conflito.txt) || "—"}</div>
    <div class="box2 cor"><b>A sua versão (ainda não salva):</b><br>${esc(a.txt) || "—"}</div></div>
    <div class="acts">
      <button class="btn pri full" data-act="cf-minha">Manter a minha</button>
      <button class="btn full" data-act="cf-juntar">Juntar as duas</button>
      <button class="btn full" data-act="cf-dela">Ficar com a de ${esc(quem)}</button>
    </div>`);
  $("#sheet .sheet").dataset.task = "";
}
function resolveConflict(op){
  const C = S.conflito; if (!C) return;
  S.conflito = null;
  const {a, conflito} = C, k = `${a.hid}|${a.data}|${a.tarefa}`;
  removeSheet();
  if (op === "dela") { setDraft(k, null); toast("Mantida a versão mais recente, de " + (conflito.nome || "outra pessoa") + "."); }
  else {
    const txt = op === "juntar" ? [conflito.txt, a.txt].filter(Boolean).join("\n") : a.txt;
    setDraft(k, txt);
    enqueue({tipo:"obs", tarefa:a.tarefa, data:a.data, txt, base:conflito.em, forcar:true});
    toast(op === "juntar" ? "As duas versões foram juntadas." : "A sua versão foi mantida.");
  }
  if (S.openTask && a.tarefa === S.openTask) renderTaskSheet(true); else { S.openTask = null; rerenderKeepScroll(); }
}
